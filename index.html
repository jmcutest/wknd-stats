        body {
            font-family: 'Inter', sans-serif;

            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        /* Animated pulsing ring for armed action state */
        @keyframes targetPulse {
            0%, 100% { border-color: rgba(249, 115, 22, 0.4); box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.2); }
            50% { border-color: rgba(249, 115, 22, 0.9); box-shadow: 0 0 10px 3px rgba(249, 115, 22, 0.4); }
        }
        .armed-target {
            animation: targetPulse 2s infinite ease-in-out;
            cursor: pointer;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Detect if loaded in live sync environment
        const hasFirebaseConfig = typeof __firebase_config !== 'undefined';
        if (hasFirebaseConfig) {
            try {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);
                
                window.firebaseApp = app;
                window.firebaseDb = db;
                window.firebaseAuth = auth;
                window.firebaseUtils = { doc, setDoc, getDoc, onSnapshot, collection, deleteDoc, signInAnonymously, signInWithCustomToken };
                console.log("Real-time cloud database initialized successfully.");
            } catch (e) {
                console.warn("Could not bind cloud sync (running standalone offline).", e);
            }
        }
    </script>

        function App() {
            const [teams, setTeams] = useState([]);
            const [games, setGames] = useState([]);
            const [activeTab, setActiveTab] = useState('live');

            // Live Game Settings & Active Play States

            const [teamAId, setTeamAId] = useState("");
            const [teamBId, setTeamBId] = useState("");

            const [teamALineup, setTeamALineup] = useState([]);
            const [teamABench, setTeamABench] = useState([]);
            const [teamBLineup, setTeamBLineup] = useState([]);
            const [teamBBench, setTeamBBench] = useState([]);
            
            // Live Stats State
            const [liveStats, setLiveStats] = useState({});
            const [gameLog, setGameLog] = useState([]);
            
            // Tracking transaction history to enable single-tap Undos
            const [loggedHistory, setLoggedHistory] = useState([]);

            // ACTION-FIRST FLOW STATE
            const [activeAction, setActiveAction] = useState(null); 
            const [correctionMode, setCorrectionMode] = useState(false); 
            const [showLoggingModal, setShowLoggingModal] = useState(false);

            // Active mobile tab for live console tracking
            const [activeMobileConsoleTab, setActiveMobileConsoleTab] = useState('home');

            // Clock Management
            const [timerSeconds, setTimerSeconds] = useState(600);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const timerRef = useRef(null);

            // Modals & UI confirmations
            const [showNewTeamModal, setShowNewTeamModal] = useState(false);
            const [newTeamName, setNewTeamName] = useState("");
            const [newTeamColor, setNewTeamColor] = useState("#3b82f6");

            const [showNewPlayerModal, setShowNewPlayerModal] = useState(false);
            const [selectedTeamIdForPlayer, setSelectedTeamIdForPlayer] = useState("");
            const [newPlayerName, setNewPlayerName] = useState("");
            const [newPlayerNumber, setNewPlayerNumber] = useState("");

            const [showSubstitutionModal, setShowSubstitutionModal] = useState(false);
            const [subTargetPlayer, setSubTargetPlayer] = useState(null); 

            // Custom UI dialog states replacing browser alerts
            const [confirmDialog, setConfirmDialog] = useState(null); // { title, text, onConfirm }

            // Scroll Lock Effect to prevent background scrolling on mobile Safari/Chrome
            useEffect(() => {
                const isAnyModalOpen = showNewTeamModal || showNewPlayerModal || showSubstitutionModal || showLoggingModal || !!confirmDialog;
                if (isAnyModalOpen) {
                    document.body.style.overflow = 'hidden';
                    document.body.style.position = 'fixed';
                    document.body.style.width = '100%';
                } else {
                    document.body.style.overflow = '';
                    document.body.style.position = '';
                    document.body.style.width = '';
                }
                return () => {
                    document.body.style.overflow = '';
                    document.body.style.position = '';
                    document.body.style.width = '';
                };
            }, [showNewTeamModal, showNewPlayerModal, showSubstitutionModal, showLoggingModal, confirmDialog]);

            // BACKUP UTILITIES FOR DATA PORTABILITY
            const handleExportData = () => {
                try {
                    const backupData = {
                        teams: teams,
                        games: games
                    };
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `league_stats_backup_${new Date().toISOString().split('T')[0]}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                    showToast("Database backup file downloaded!", "success");
                } catch (e) {
                    showToast("Failed to compile database export.", "error");
                }
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const fileReader = new FileReader();
                fileReader.readAsText(file, "UTF-8");
                fileReader.onload = (event) => {
                    try {
                        const parsedData = JSON.parse(event.target.result);
                        if (parsedData && Array.isArray(parsedData.teams)) {
                            // Save teams securely to storage
                            saveTeamState(parsedData.teams);
                            
                            // Load games safely
                            if (Array.isArray(parsedData.games)) {
                                setGames(parsedData.games);
                                if (!window.firebaseDb) {
                                    localStorage.setItem('stat_games', JSON.stringify(parsedData.games));
                                }
                            }
                            
                            showToast("Database backup successfully restored!", "success");
                        } else {
                            showToast("Invalid backup file format.", "error");
                        }
                    } catch (err) {
                        showToast("Failed to parse system backup file.", "error");
                    }
                };
            };

            const handleMergeData = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const fileReader = new FileReader();
                fileReader.readAsText(file, "UTF-8");
                fileReader.onload = (event) => {
                    try {
                        const parsedData = JSON.parse(event.target.result);
                        if (!parsedData || !Array.isArray(parsedData.teams) || !Array.isArray(parsedData.games)) {
                            showToast("Invalid backup file format for merging.", "error");
                            return;
                        }

                        // 1. Find new games that don't exist locally
                        const newGames = parsedData.games.filter(ig => !games.some(lg => lg.id === ig.id));
                        if (newGames.length === 0) {
                            showToast("No new game records found to merge.", "info");
                            return;
                        }

                        // 2. Clone current teams to safely mutate rosters
                        let mergedTeams = JSON.parse(JSON.stringify(teams));

                        // 3. Add any completely new teams
                        parsedData.teams.forEach(importedTeam => {
                            if (!mergedTeams.some(localTeam => localTeam.id === importedTeam.id)) {
                                mergedTeams.push(importedTeam);
                            }
                        });

                        // 4. Add any completely new players to existing teams
                        parsedData.teams.forEach(importedTeam => {
                            const localTeam = mergedTeams.find(t => t.id === importedTeam.id);
                            if (localTeam) {
                                importedTeam.players.forEach(importedPlayer => {
                                    if (!localTeam.players.some(p => p.id === importedPlayer.id)) {
                                        // Initialize new players with 0 stats (the upcoming newGames loop will update them correctly)
                                        const newPlayerObj = {
                                            ...importedPlayer,
                                            gamesPlayed: 0,
                                            totalStats: { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0 }
                                        };
                                        localTeam.players.push(newPlayerObj);
                                    }
                                });
                            }
                        });

                        // 5. Accumulate career averages ONLY from the newly combined matches
                        newGames.forEach(game => {
                            Object.entries(game.playerStats).forEach(([playerId, stats]) => {
                                let foundPlayer = null;
                                for (let t of mergedTeams) {
                                    foundPlayer = t.players.find(p => p.id === playerId);
                                    if (foundPlayer) break;
                                }

                                if (foundPlayer) {
                                    foundPlayer.gamesPlayed += 1;
                                    foundPlayer.totalStats.pts += (stats.pts || 0);
                                    foundPlayer.totalStats.ast += (stats.ast || 0);
                                    foundPlayer.totalStats.reb += (stats.reb || 0);
                                    foundPlayer.totalStats.stl += (stats.stl || 0);
                                    foundPlayer.totalStats.blk += (stats.blk || 0);
                                    foundPlayer.totalStats.to += (stats.to || 0);
                                    foundPlayer.totalStats.pf += (stats.pf || 0);
                                    foundPlayer.totalStats.fg2m = (foundPlayer.totalStats.fg2m || 0) + (stats.fg2m || 0);
                                    foundPlayer.totalStats.fg3m = (foundPlayer.totalStats.fg3m || 0) + (stats.fg3m || 0);
                                }
                            });
                        });

                        // 6. Combine the games lists and sort descending
                        const mergedGames = [...newGames, ...games].sort((a, b) => b.id.localeCompare(a.id));

                        // 7. Commit state changes
                        saveTeamState(mergedTeams);
                        setGames(mergedGames);
                        if (!window.firebaseDb) {
                            localStorage.setItem('stat_games', JSON.stringify(mergedGames));
                        }

                        showToast(`Merged ${newGames.length} new game(s) & updated roster averages!`, "success");
                    } catch (err) {
                        console.error(err);
                        showToast("Failed to compile dataset merge.", "error");
                    }
                };
            };

            useEffect(() => {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'wknd-league-stats';

                if (window.firebaseDb) {
                    const { collection, onSnapshot, signInAnonymously, signInWithCustomToken } = window.firebaseUtils;
                    const auth = window.firebaseAuth;

                    const initializeSync = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await signInAnonymously(auth);
                            }
                        } catch (e) {
                            console.warn("Authentication failed, loading offline fallback data.", e);
                        }

                        // Sync Teams
                        const teamsPath = collection(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'teams');
                        const unsubTeams = onSnapshot(teamsPath, (snapshot) => {
                            const cloudTeams = [];
                            snapshot.forEach(doc => {
                                cloudTeams.push({ id: doc.id, ...doc.data() });
                            });
                            if (cloudTeams.length > 0) {
                                setTeams(cloudTeams);
                            } else {
                                setTeams(initialTeams);
                            }
                        }, (err) => console.warn("Could not listen to teams on cloud database", err));

                        // Sync Games
                        const gamesPath = collection(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'games');
                        const unsubGames = onSnapshot(gamesPath, (snapshot) => {
                            const cloudGames = [];
                            snapshot.forEach(doc => {
                                cloudGames.push({ id: doc.id, ...doc.data() });
                            });
                            setGames(cloudGames.sort((a, b) => b.id.localeCompare(a.id)));
                        }, (err) => console.warn("Could not listen to games on cloud database", err));

                        return () => {
                            unsubTeams();
                            unsubGames();
                        };
                    };

                    initializeSync();
                } else {
                    // Fallback to LocalStorage offline mode
                    const savedTeams = localStorage.getItem('stat_teams');
                    const savedGames = localStorage.getItem('stat_games');
                    setTeams(savedTeams ? JSON.parse(savedTeams) : initialTeams);
                    setGames(savedGames ? JSON.parse(savedGames) : initialGames);
                }
            }, []);

            useEffect(() => {
                if (!window.firebaseDb && teams.length > 0) {
                    localStorage.setItem('stat_teams', JSON.stringify(teams));
                }
            }, [teams]);

            useEffect(() => {
                if (!window.firebaseDb && games.length > 0) {
                    localStorage.setItem('stat_games', JSON.stringify(games));
                }
            }, [games]);

            // Timer management hook
            useEffect(() => {
                if (isTimerRunning) {
                    timerRef.current = setInterval(() => {
                        setTimerSeconds((prev) => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                setIsTimerRunning(false);
                                showToast("Game period finished!", "info");
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [isTimerRunning]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const saveTeamState = async (updatedTeams) => {
                setTeams(updatedTeams);
                if (window.firebaseDb) {
                    const { doc, setDoc } = window.firebaseUtils;
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'wknd-league-stats';
                    for (const team of updatedTeams) {
                        await setDoc(doc(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'teams', team.id), team);
                    }
                }
            };

            const saveNewGameState = async (newGame, updatedTeams) => {
                setGames(prev => [newGame, ...prev]);
                setTeams(updatedTeams);
                if (window.firebaseDb) {
                    const { doc, setDoc } = window.firebaseUtils;
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'wknd-league-stats';
                    await setDoc(doc(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'games', newGame.id), newGame);
                    for (const team of updatedTeams) {
                        await setDoc(doc(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'teams', team.id), team);
                    }
                }
            };

            const handleStartMatch = (e) => {
                e.preventDefault();
                if (!teamAId || !teamBId) {
                    showToast("Please select two competing teams.", "error");
                    return;
                }
                if (teamAId === teamBId) {
                    showToast("A team cannot play against itself!", "error");
                    return;
                }

                const teamAObj = teams.find(t => t.id === teamAId);
                const teamBObj = teams.find(t => t.id === teamBId);

                if (!teamAObj || !teamBObj) return;
                if (teamAObj.players.length === 0 || teamBObj.players.length === 0) {
                    showToast("Both teams must have players registered in order to play.", "error");
                    return;
                }

                // Starters setup (first 5 or all available if fewer)
                const startersA = teamAObj.players.slice(0, 5).map(p => p.id);
                const benchA = teamAObj.players.slice(5).map(p => p.id);

                const startersB = teamBObj.players.slice(0, 5).map(p => p.id);
                const benchB = teamBObj.players.slice(5).map(p => p.id);

                setTeamALineup(startersA);
                setTeamABench(benchA);
                setTeamBLineup(startersB);
                setTeamBBench(benchB);

                const initializedStats = {};
                teamAObj.players.forEach(p => {
                    initializedStats[p.id] = { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0 };
                });
                teamBObj.players.forEach(p => {
                    initializedStats[p.id] = { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0 };
                });

                setLiveStats(initializedStats);
                setTeamAScore(0);
                setTeamBScore(0);
                setTimerSeconds(600);
                setIsTimerRunning(false);
                setActiveAction(null);
                setCorrectionMode(false);
                setLoggedHistory([]);
                setGameLog([{ time: "10:00", text: `Match initialized: ${teamAObj.name} vs ${teamBObj.name}` }]);
                setIsGameLive(true);
                showToast("Console loaded! Arm an Action and tap a Player to log.", "success");
            };

            const handlePlayerClick = (playerId, isTeamA) => {
                if (!activeAction) {
                    showToast("Please select a stat action from the deck first!", "error");
                    return;
                }

                const multiplier = correctionMode ? -1 : 1;
                const changeAmount = activeAction.val * multiplier;
                const statField = activeAction.stat;

                // Generate Game Log Entries
                const playerObj = teams.flatMap(t => t.players).find(p => p.id === playerId);
                let logText = "";
                if (playerObj) {
                    if (correctionMode) {
                        logText = `🔄 CORRECTION: ${playerObj.name} stat adjusted (${activeAction.label} removed)`;
                    } else {
                        if (statField === 'pts') {
                            logText = `🏀 SCORE! ${playerObj.name} hits for +${activeAction.val} PTS`;
                        } else if (statField === 'ast') {
                            logText = `🪄 Smooth assist registered by ${playerObj.name}`;
                        } else if (statField === 'reb') {
                            logText = `🛡️ Rebound pulled down by ${playerObj.name}`;
                        } else if (statField === 'stl') {
                            logText = `⚡ Intercepted! Steal recorded for ${playerObj.name}`;
                        } else if (statField === 'blk') {
                            logText = `🚫 Blocked! Defensive play by ${playerObj.name}`;
                        } else if (statField === 'to') {
                            logText = `⚠️ Turnover charged to ${playerObj.name}`;
                        } else if (statField === 'pf') {
                            logText = `❌ Foul called against ${playerObj.name}`;
                        } else if (statField === 'fg2m') {
                            logText = `⚠️ 2PT field goal missed by ${playerObj.name}`;
                        } else if (statField === 'fg3m') {
                            logText = `⚠️ 3PT field goal missed by ${playerObj.name}`;
                        }
                    }
                }

                const logWithTag = `[${isTeamA ? 'HOME' : 'AWAY'}] ${logText}`;

                // Push to Undo Transaction History
                const undoRecord = {
                    playerId,
                    statField,
                    changeAmount,
                    previousTeamAScore: teamAScore,
                    previousTeamBScore: teamBScore,
                    logText: logWithTag
                };
                setLoggedHistory(prev => [undoRecord, ...prev]);

                setLiveStats(prev => {
                    const currentVal = prev[playerId]?.[statField] || 0;
                    const newVal = Math.max(0, currentVal + changeAmount);

                    const updated = {
                        ...prev,
                        [playerId]: {
                            ...prev[playerId],
                            [statField]: newVal
                        }
                    };

                    // Re-calculate scores dynamically based on all computed points
                    let totalA = 0;
                    let totalB = 0;
                    const teamAObj = teams.find(t => t.id === teamAId);
                    const teamBObj = teams.find(t => t.id === teamBId);

                    if (teamAObj) {
                        teamAObj.players.forEach(p => {
                            totalA += updated[p.id]?.pts || 0;
                        });
                    }
                    if (teamBObj) {
                        teamBObj.players.forEach(p => {
                            totalB += updated[p.id]?.pts || 0;
                        });
                    }

                    setTeamAScore(totalA);
                    setTeamBScore(totalB);

                    return updated;
                });

                if (playerObj) {
                    setGameLog(prev => [
                        { time: formatTime(timerSeconds), text: logWithTag },
                        ...prev.slice(0, 50)
                    ]);
                }

                // Disarm active action and close modal dialog instantly
                setActiveAction(null);
                setCorrectionMode(false);
                setShowLoggingModal(false);
                showToast("Logged successfully!");
            };

            const handleUndo = () => {
                if (loggedHistory.length === 0) {
                    showToast("No logged actions left to undo!", "error");
                    return;
                }

                const [lastAction, ...remainingHistory] = loggedHistory;
                setLoggedHistory(remainingHistory);

                setLiveStats(prev => {
                    const currentPlayerStats = prev[lastAction.playerId];
                    if (!currentPlayerStats) return prev;
                    
                    return {
                        ...prev,
                        [lastAction.playerId]: {
                            ...currentPlayerStats,
                            [lastAction.statField]: Math.max(0, (currentPlayerStats[lastAction.statField] || 0) - lastAction.changeAmount)
                        }
                    };
                });

                setTeamAScore(lastAction.previousTeamAScore);
                setTeamBScore(lastAction.previousTeamBScore);

                // Remove corresponding log entry from feed
                setGameLog(prev => prev.filter(log => log.text !== lastAction.logText));
                showToast("Last action undone successfully!", "info");
            };

            const triggerSubModal = (playerId, isTeamA) => {
                const playerObj = teams.flatMap(t => t.players).find(p => p.id === playerId);
                if (!playerObj) return;
                setSubTargetPlayer({ id: playerId, name: playerObj.name, number: playerObj.number, team: isTeamA ? 'A' : 'B' });
                setShowSubstitutionModal(true);
            };

            const executeSubstitution = (outId, inId, isTeamA) => {
                const outPlayerObj = teams.flatMap(t => t.players).find(p => p.id === outId);
                const inPlayerObj = teams.flatMap(t => t.players).find(p => p.id === inId);

                if (isTeamA) {
                    setTeamALineup(prev => prev.map(id => id === outId ? inId : id));
                    setTeamABench(prev => prev.map(id => id === inId ? outId : id));
                } else {
                    setTeamBLineup(prev => prev.map(id => id === outId ? inId : id));
                    setTeamBBench(prev => prev.map(id => id === inId ? outId : id));
                }

                setGameLog(prev => [
                    {
                        time: formatTime(timerSeconds),
                        text: `🔄 SUB [${isTeamA ? 'HOME' : 'AWAY'}]: ${inPlayerObj?.name} (#${inPlayerObj?.number}) enters for ${outPlayerObj?.name} (#${outPlayerObj?.number})`
                    },
                    ...prev
                ]);

                setShowSubstitutionModal(false);
                setSubTargetPlayer(null);
                showToast(`Substituted ${inPlayerObj?.name} into the game.`, "info");
            };

            const handleEndGame = () => {
                const teamAObj = teams.find(t => t.id === teamAId);
                const teamBObj = teams.find(t => t.id === teamBId);

                if (!teamAObj || !teamBObj) return;

                const newGameEntry = {
                    id: `game_${Date.now()}`,
                    teamAId,
                    teamBId,
                    teamAName: teamAObj.name,
                    teamBName: teamBObj.name,
                    teamAScore,
                    teamBScore,
                    date: new Date().toISOString().split('T')[0],
                    playerStats: liveStats
                };

                const updatedTeams = teams.map(t => {
                    if (t.id !== teamAId && t.id !== teamBId) return t;

                    const updatedPlayers = t.players.map(p => {
                        const statObj = liveStats[p.id];
                        if (!statObj) return p;

                        return {
                            ...p,
                            gamesPlayed: p.gamesPlayed + 1,
                            totalStats: {
                                pts: p.totalStats.pts + (statObj.pts || 0),
                                ast: p.totalStats.ast + (statObj.ast || 0),
                                reb: p.totalStats.reb + (statObj.reb || 0),
                                stl: p.totalStats.stl + (statObj.stl || 0),
                                blk: p.totalStats.blk + (statObj.blk || 0),
                                to: p.totalStats.to + (statObj.to || 0),
                                pf: p.totalStats.pf + (statObj.pf || 0),
                                fg2m: (p.totalStats.fg2m || 0) + (statObj.fg2m || 0),
                                fg3m: (p.totalStats.fg3m || 0) + (statObj.fg3m || 0),
                            }
                        };
                    });

                    return { ...t, players: updatedPlayers };
                });

                saveNewGameState(newGameEntry, updatedTeams);

                setIsGameLive(false);
                setIsTimerRunning(false);
                setActiveAction(null);
                showToast("Match finished! Player career profiles updated.", "success");
                setActiveTab('history');
            };

            const handleCreateTeam = (e) => {
                e.preventDefault();
                if (!newTeamName.trim()) return;

                const newTeam = {
                    id: `team_${Date.now()}`,
                    name: newTeamName.trim(),
                    color: newTeamColor,
                    players: []
                };

                saveTeamState([...teams, newTeam]);
                setNewTeamName("");
                setShowNewTeamModal(false);
                showToast(`Team "${newTeam.name}" registered successfully.`);
            };

            const handleCreatePlayer = (e) => {
                e.preventDefault();
                if (!newPlayerName.trim() || !newPlayerNumber.trim() || !selectedTeamIdForPlayer) {
                    showToast("Please verify all player entries.", "error");
                    return;
                }

                const newPlayer = {
                    id: `player_${Date.now()}`,
                    name: newPlayerName.trim(),
                    number: newPlayerNumber.trim(),
                    gamesPlayed: 0,
                    totalStats: { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0 }
                };

                const updatedTeams = teams.map(t => {
                    if (t.id === selectedTeamIdForPlayer) {
                        return { ...t, players: [...t.players, newPlayer] };
                    }
                    return t;
                });

                saveTeamState(updatedTeams);

                if (isGameLive) {
                    if (selectedTeamIdForPlayer === teamAId) {
                        setTeamABench(prev => [...prev, newPlayer.id]);
                        setLiveStats(prev => ({ ...prev, [newPlayer.id]: { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0 } }));
                    } else if (selectedTeamIdForPlayer === teamBId) {
                        setTeamBBench(prev => [...prev, newPlayer.id]);
                        setLiveStats(prev => ({ ...prev, [newPlayer.id]: { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0 } }));
                    }
                }

                setNewPlayerName("");
                setNewPlayerNumber("");
                setShowNewPlayerModal(false);
                showToast(`Registered ${newPlayer.name} (#${newPlayer.number})`);
            };

            const handleDeletePlayer = (teamId, playerId) => {
                if (isGameLive && (teamAId === teamId || teamBId === teamId)) {
                    showToast("Cannot delete players during an active match.", "error");
                    return;
                }

                setConfirmDialog({
                    title: "Delete Athlete?",
                    text: "This will permanently remove this player and erase all career statistical performance history.",
                    onConfirm: () => {
                        const updatedTeams = teams.map(t => {
                            if (t.id === teamId) {
                                return { ...t, players: t.players.filter(playerItem => playerItem.id !== playerId) };
                            }
                            return t;
                        });
                        saveTeamState(updatedTeams);
                        setConfirmDialog(null);
                        showToast("Player removed from roster.");
                    }
                });
            };

            const handleDeleteTeam = (teamId) => {
                if (isGameLive && (teamAId === teamId || teamBId === teamId)) {
                    showToast("Cannot delete a team while they are playing live.", "error");
                    return;
                }

                setConfirmDialog({
                    title: "Erase Franchise?",
                    text: "Are you sure you want to delete this franchise? All player contracts and career stats will be permanently wiped.",
                    onConfirm: () => {
                        const remaining = teams.filter(t => t.id !== teamId);
                        setTeams(remaining);

                        if (window.firebaseDb) {
                            const { doc, deleteDoc } = window.firebaseUtils;
                            const appId = typeof __app_id !== 'undefined' ? __app_id : 'wknd-league-stats';
                            deleteDoc(doc(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'teams', teamId));
                        }

                        setConfirmDialog(null);
                        showToast("Team removed from league roster.");
                    }
                });
            };

            const getAverages = (player) => {
                const gp = player.gamesPlayed || 0;
                if (gp === 0) return { pts: '0.0', ast: '0.0', reb: '0.0', stl: '0.0', blk: '0.0', to: '0.0', pf: '0.0', fg2m: '0.0', fg3m: '0.0' };
                return {
                    pts: (player.totalStats.pts / gp).toFixed(1),
                    ast: (player.totalStats.ast / gp).toFixed(1),
                    reb: (player.totalStats.reb / gp).toFixed(1),
                    stl: (player.totalStats.stl / gp).toFixed(1),
                    blk: (player.totalStats.blk / gp).toFixed(1),
                    to: (player.totalStats.to / gp).toFixed(1),
                    pf: (player.totalStats.pf / gp).toFixed(1),
                    fg2m: ((player.totalStats.fg2m || 0) / gp).toFixed(1),
                    fg3m: ((player.totalStats.fg3m || 0) / gp).toFixed(1)
                };
            };

            const renderPlayerCompactRow = (playerId, isTeamA) => {
                const teamObj = isTeamA ? teams.find(t => t.id === teamAId) : teams.find(t => t.id === teamBId);
                if (!teamObj) return null;
                const player = teamObj.players.find(p => p.id === playerId);
                if (!player) return null;
                const stats = liveStats[playerId] || { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0 };

                const hasActionArmed = activeAction !== null;

                return (
                    <div 
                        key={player.id} 
                        onClick={() => hasActionArmed && handlePlayerClick(player.id, isTeamA)}
                        className={`bg-slate-950/90 border p-3.5 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3 transition-all select-none ${
                            hasActionArmed 
                            ? 'armed-target hover:bg-slate-900 border-orange-500/50' 
                            : 'border-slate-800 hover:border-slate-700/60'
                        }`}
                        title={hasActionArmed ? `Click to apply ${correctionMode ? 'CORRECTION: ' : ''}${activeAction.label} to ${player.name}` : "Arm an action first"}
                    >
                        <div className="flex items-center gap-3 flex-shrink-0">
                            <span className="font-mono text-xs font-bold text-slate-300 bg-slate-900 px-2.5 py-1 rounded-xl border border-slate-800">
                                #{player.number}
                            </span>
                            <div className="min-w-0">
                                <span className="font-extrabold text-sm text-white block truncate">{player.name}</span>
                                <button 
                                    onClick={(e) => {
                                        e.stopPropagation(); 
                                        triggerSubModal(player.id, isTeamA);
                                    }}
                                    className="text-[10px] text-orange-400 hover:text-orange-300 font-bold flex items-center gap-1 mt-0.5 cursor-pointer"
                                >
                                    <Icons.ArrowRightLeft /> Substitute
                                </button>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-1.5 text-[11px] font-mono font-bold bg-slate-900/60 px-3 py-2 rounded-xl border border-slate-850/80">
                            <span className="text-orange-400">PTS: <span className="text-white text-xs">{stats.pts}</span></span>
                            <span className="text-slate-600">•</span>
                            <span className="text-emerald-400">REB: <span className="text-white">{stats.reb}</span></span>
                            <span className="text-slate-600">•</span>
                            <span className="text-blue-400">AST: <span className="text-white">{stats.ast}</span></span>
                            <span className="text-slate-600">•</span>
                            <span className="text-teal-400">STL: <span className="text-white">{stats.stl}</span></span>
                            <span className="text-slate-600">•</span>
                            <span className="text-violet-400">BLK: <span className="text-white">{stats.blk}</span></span>
                            <span className="text-slate-600">•</span>
                            <span className="text-amber-500">TO: <span className="text-white">{stats.to}</span></span>
                            <span className="text-slate-600">•</span>
                            <span className={`px-1.5 py-0.5 rounded ${stats.pf >= 4 ? 'bg-red-950 text-red-400 border border-red-900' : 'text-slate-400'}`}>
                                PF: {stats.pf}/5
                            </span>
                            <span className="text-slate-600">•</span>
                            <span className="text-red-400">MISS: <span className="text-rose-100">{stats.fg2m || 0} (2P)</span> / <span className="text-rose-100">{stats.fg3m || 0} (3P)</span></span>
                        </div>
                    </div>
                );
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-6 md:py-8">
                    
                    {/* LEAGUE HEADER */}
                    <header className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6 border-b border-slate-800 pb-5">
                        <div className="flex items-center gap-3">
                            <Icons.Basketball />
                            <div>

                                {/* LEAGUE PPG VISUALIZATION CHART */}
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                                    <h4 className="font-extrabold text-sm text-slate-200 uppercase tracking-wider mb-4">League-Wide Average Points (PPG)</h4>
                                    
                                    {teams.flatMap(t => t.players).length === 0 ? (
                                        <p className="text-slate-500 text-xs py-6 italic text-center">No league athletes found to render the visualization metrics.</p>
                                    ) : (
                                        <div className="space-y-4">
                                            {teams
                                                .flatMap(t => t.players.map(p => ({ ...p, teamColor: t.color, avg: getAverages(p) })))
                                                .sort((a, b) => parseFloat(b.avg.pts) - parseFloat(a.avg.pts))
                                                .slice(0, 8)
                                                .map(p => {
                                                    const ppgValue = parseFloat(p.avg.pts);
                                                    const maxPpg = Math.max(...teams.flatMap(t => t.players.map(player => parseFloat(getAverages(player).pts))), 1);
                                                    const pct = Math.max(5, (ppgValue / maxPpg) * 100);

                                                    return (
                                                        <div key={p.id} className="space-y-1 text-xs">
                                                            <div className="flex justify-between items-center text-slate-300">
                                                                <span className="font-bold flex items-center gap-2">
                                                                    <span className="w-2 h-2 rounded-full" style={{ backgroundColor: p.teamColor }} />
                                                                    {p.name} <span className="text-slate-500 font-mono">#{p.number}</span>
                                                                </span>
                                                                <span className="font-mono text-orange-400 font-bold">{p.avg.pts} PPG</span>
                                                            </div>
                                                            <div className="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden">
                                                                <div 
                                                                    className="h-full rounded-full transition-all duration-500"
                                                                    style={{ width: `${pct}%`, backgroundColor: p.teamColor || '#f97316' }}
                                                                />
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                        </div>
                                    )}
                                </div>

                            </div>
                        )}

                    </main>

                    {/* FOOTER BAR */}
                    <footer className="mt-16 pt-5 border-t border-slate-850 text-center text-[11px] text-slate-500">
                        <p>© 2026 League Statistician Console. Securely saving records in real-time Cloud Sync.</p>
                    </footer>

                    {/* MODAL: NEW TEAM CREATION */}
                    {showNewTeamModal && (
                        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/60 backdrop-blur-sm flex items-start sm:items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md shadow-2xl relative my-auto">
                                <h3 className="text-base font-bold text-white mb-1">Create League Franchise</h3>
                                <p className="text-xs text-slate-400 mb-4">Register a team squad name and branding color code in your league registry.</p>
                                
                                <form onSubmit={handleCreateTeam} className="space-y-4 text-xs">
                                    <div>
                                        <label className="block font-bold text-slate-400 uppercase tracking-wider mb-1.5">Team Name</label>
                                        <input 
                                            type="text"
                                            value={newTeamName}
                                            onChange={(e) => setNewTeamName(e.target.value)}
                                            placeholder="e.g. Southside Vipers"
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white text-sm focus:outline-none focus:border-orange-500 transition-colors"
                                            required
                                        />
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-400 uppercase tracking-wider mb-1.5">Franchise Color</label>
                                        <div className="flex gap-2 items-center">
                                            <input 
                                                type="color"
                                                value={newTeamColor}
                                                onChange={(e) => setNewTeamColor(e.target.value)}
                                                className="w-10 h-10 bg-transparent rounded border border-slate-800 cursor-pointer"
                                            />
                                            <span className="font-mono text-slate-400 font-bold">{newTeamColor}</span>
                                        </div>
                                    </div>

                                    <div className="flex gap-2 pt-2 text-sm font-semibold">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowNewTeamModal(false)}
                                            className="flex-1 py-2 bg-slate-950 hover:bg-slate-850 text-slate-400 rounded-xl transition-colors cursor-pointer"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="flex-1 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-xl transition-colors shadow-lg shadow-orange-500/10 cursor-pointer"
                                        >
                                            Create Team
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: REGISTER NEW PLAYER */}
                    {showNewPlayerModal && (
                        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/60 backdrop-blur-sm flex items-start sm:items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md shadow-2xl relative my-auto">
                                <h3 className="text-base font-bold text-white mb-1">Add Player Roster Entry</h3>
                                <p className="text-xs text-slate-400 mb-4">Complete physical registration details for individual player profiling.</p>

                                <form onSubmit={handleCreatePlayer} className="space-y-4 text-xs">
                                    <div>
                                        <label className="block font-bold text-slate-400 uppercase tracking-wider mb-1.5">Select Franchise</label>
                                        <select 
                                            value={selectedTeamIdForPlayer}
                                            onChange={(e) => setSelectedTeamIdForPlayer(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white text-sm focus:outline-none"
                                            required
                                        >
                                            {teams.map(t => (
                                                <option key={t.id} value={t.id}>{t.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-400 uppercase tracking-wider mb-1.5">Player Full Name</label>
                                        <input 
                                            type="text"
                                            value={newPlayerName}
                                            onChange={(e) => setNewPlayerName(e.target.value)}
                                            placeholder="e.g. Stephen Curry"
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white text-sm focus:outline-none"
                                            required
                                        />
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-400 uppercase tracking-wider mb-1.5">Jersey / Uniform Number</label>
                                        <input 
                                            type="text"
                                            value={newPlayerNumber}
                                            onChange={(e) => setNewPlayerNumber(e.target.value)}
                                            placeholder="e.g. 30"
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white text-sm focus:outline-none font-mono"
                                            required
                                        />
                                    </div>

                                    <div className="flex gap-2 pt-2 text-sm font-semibold">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowNewPlayerModal(false)}
                                            className="flex-1 py-2 bg-slate-950 hover:bg-slate-850 text-slate-400 rounded-xl transition-colors cursor-pointer"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="flex-1 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-xl transition-colors shadow-lg shadow-orange-500/10 cursor-pointer"
                                        >
                                            Register Player
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: SUBSTITUTION PLAYER SELECTOR */}
                    {showSubstitutionModal && subTargetPlayer && (
                        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-start sm:items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md shadow-2xl relative my-auto">
                                <h3 className="text-base font-bold text-white mb-1 flex items-center gap-1.5">
                                    <Icons.ArrowRightLeft /> Substitute Athlete
                                </h3>
                                <p className="text-xs text-slate-400 mb-4">
                                    Select a player from the bench of <strong className="text-white">{subTargetPlayer.team === 'A' ? teams.find(t => t.id === teamAId)?.name : teams.find(t => t.id === teamBId)?.name}</strong> to replace <strong className="text-white">{subTargetPlayer.name} (#{subTargetPlayer.number})</strong>.
                                </p>

                                <div className="space-y-2.5 max-h-[250px] overflow-y-auto pr-1">
                                    {(() => {
                                        const benchIds = subTargetPlayer.team === 'A' ? teamABench : teamBBench;
                                        const teamObj = subTargetPlayer.team === 'A' ? teams.find(t => t.id === teamAId) : teams.find(t => t.id === teamBId);

                                        if (!teamObj || benchIds.length === 0) {
                                            return <p className="text-xs text-slate-500 italic text-center py-6">No players currently sitting on the bench.</p>;
                                        }

                                        return benchIds.map(benchId => {
                                            const player = teamObj.players.find(p => p.id === benchId);
                                            if (!player) return null;

                                            return (
                                                <button 
                                                    key={benchId}
                                                    onClick={() => executeSubstitution(subTargetPlayer.id, benchId, subTargetPlayer.team === 'A')}
                                                    className="w-full text-xs flex items-center justify-between p-3.5 bg-slate-950 hover:bg-orange-500/10 hover:border-orange-500/40 group rounded-xl border border-slate-850 transition-all text-left cursor-pointer"
                                                >
                                                    <div>
                                                        <span className="font-bold text-slate-200 group-hover:text-white transition-colors">{player.name}</span>
                                                        <span className="text-[10px] text-slate-500 group-hover:text-orange-200 block transition-colors">Jersey #{player.number}</span>
                                                    </div>
                                                    <span className="text-[10px] font-bold text-orange-400 group-hover:text-white transition-colors flex items-center gap-1">
                                                        Sub In <Icons.ChevronRight />
                                                    </span>
                                                </button>
                                            );
                                        });
                                    })()}
                                </div>

                                <div className="pt-4 mt-4 border-t border-slate-850 flex justify-end">
                                    <button 
                                        onClick={() => {
                                            setShowSubstitutionModal(false);
                                            setSubTargetPlayer(null);
                                        }}
                                        className="px-4 py-2 bg-slate-950 hover:bg-slate-850 text-slate-400 hover:text-white text-xs font-semibold rounded-xl border border-slate-850 transition-all cursor-pointer"
                                    >
                                        Cancel Substitution
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: ACTION TARGET PLAYER SELECTOR (POPUP FLOW) */}
                    {showLoggingModal && activeAction && (
                        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm flex items-start sm:items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-2xl shadow-2xl relative my-auto">
                                <div className="text-center mb-5">
                                    <span className={`px-3 py-1 text-xs rounded-full font-bold uppercase tracking-widest font-mono border ${
                                        correctionMode 
                                        ? 'bg-red-950/80 border-red-800 text-red-400' 
                                        : 'bg-orange-500/10 border-orange-500/20 text-orange-400'
                                    }`}>
                                        {correctionMode ? '🔄 CORRECTION MODE' : '🎯 RECORD ACTION'}
                                    </span>
                                    <h3 className="text-xl font-black mt-3 text-white">
                                        Select Player to Log: <span className="text-orange-400 font-mono">{activeAction.label}</span>
                                    </h3>
                                    <p className="text-slate-400 text-xs mt-1">Tap any active on-court player to apply this statistic.</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mt-4">
                                    {/* HOME TEAM ON-COURT PLAYERS */}
                                    <div className="bg-slate-950/60 p-4 rounded-xl border border-slate-850">
                                        <div className="flex items-center gap-2 mb-3 pb-2 border-b border-slate-850">
                                            <span className="w-3 h-3 rounded-full" style={{ backgroundColor: teams.find(t => t.id === teamAId)?.color }} />
                                            <span className="font-extrabold text-xs text-slate-300 uppercase tracking-wider">
                                                HOME: {teams.find(t => t.id === teamAId)?.name}
                                            </span>
                                        </div>
                                        <div className="space-y-2">
                                            {teamALineup.map(playerId => {
                                                const player = teams.find(t => t.id === teamAId)?.players.find(p => p.id === playerId);
                                                if (!player) return null;
                                                return (
                                                    <button
                                                        key={playerId}
                                                        onClick={() => handlePlayerClick(playerId, true)}
                                                        className="w-full p-3.5 bg-slate-900 hover:bg-orange-500/10 border border-slate-800 hover:border-orange-500/40 rounded-xl flex items-center gap-3 transition-all text-left font-bold text-white group cursor-pointer"
                                                    >
                                                        <span className="font-mono text-xs text-slate-400 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-850">
                                                            #{player.number}
                                                        </span>
                                                        <span className="truncate group-hover:text-orange-300 transition-colors">{player.name}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* AWAY TEAM ON-COURT PLAYERS */}
                                    <div className="bg-slate-950/60 p-4 rounded-xl border border-slate-850">
                                        <div className="flex items-center gap-2 mb-3 pb-2 border-b border-slate-850">
                                            <span className="w-3 h-3 rounded-full" style={{ backgroundColor: teams.find(t => t.id === teamBId)?.color }} />
                                            <span className="font-extrabold text-xs text-slate-300 uppercase tracking-wider">
                                                AWAY: {teams.find(t => t.id === teamBId)?.name}
                                            </span>
                                        </div>
                                        <div className="space-y-2">
                                            {teamBLineup.map(playerId => {
                                                const player = teams.find(t => t.id === teamBId)?.players.find(p => p.id === playerId);
                                                if (!player) return null;
                                                return (
                                                    <button
                                                        key={playerId}
                                                        onClick={() => handlePlayerClick(playerId, false)}
                                                        className="w-full p-3.5 bg-slate-900 hover:bg-orange-500/10 border border-slate-800 hover:border-orange-500/40 rounded-xl flex items-center gap-3 transition-all text-left font-bold text-white group cursor-pointer"
                                                    >
                                                        <span className="font-mono text-xs text-slate-400 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-850">
                                                            #{player.number}
                                                        </span>
                                                        <span className="truncate group-hover:text-orange-300 transition-colors">{player.name}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <div className="pt-4 mt-5 border-t border-slate-850 flex justify-end">
                                    <button
                                        onClick={() => {
                                            setShowLoggingModal(false);
                                            setActiveAction(null);
                                            setCorrectionMode(false);
                                        }}
                                        className="px-5 py-2.5 bg-slate-950 hover:bg-slate-850 text-slate-400 hover:text-white text-xs font-semibold rounded-xl border border-slate-850 transition-all cursor-pointer"
                                    >
                                        Cancel & Disarm Action
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {confirmDialog && (
                        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-start sm:items-center justify-center p-4 animate-fade-in">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-sm shadow-2xl relative my-auto">
                                <h3 className="text-lg font-extrabold text-white mb-2 flex items-center gap-2">
                                    <Icons.ShieldAlert /> {confirmDialog.title}
                                </h3>
                                <p className="text-xs text-slate-400 leading-relaxed mb-6">
                                    {confirmDialog.text}
                                </p>
                                <div className="flex gap-3 text-xs font-bold">
                                    <button 
                                        onClick={() => setConfirmDialog(null)}
                                        className="flex-1 py-2.5 bg-slate-950 hover:bg-slate-850 text-slate-400 rounded-xl transition-colors border border-slate-850"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={confirmDialog.onConfirm}
                                        className="flex-1 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl transition-all shadow-lg shadow-red-600/10"
                                    >
                                        Confirm
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
