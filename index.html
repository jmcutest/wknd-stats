        @keyframes targetPulse {
            0%, 100% { border-color: rgba(16, 185, 129, 0.4); box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.2); }
            50% { border-color: rgba(16, 185, 129, 0.9); box-shadow: 0 0 10px 3px rgba(16, 185, 129, 0.4); }

        // Detect if loaded in live sync environment
        const hasFirebaseConfig = typeof __firebase_config !== 'undefined';
        if (hasFirebaseConfig) {
            try {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);
                
                window.firebaseApp = app;
                window.firebaseDb = db;
                window.firebaseAuth = auth;
                window.firebaseUtils = { doc, setDoc, getDoc, onSnapshot, collection, deleteDoc, signInAnonymously, signInWithCustomToken };
                console.log("Real-time cloud database initialized successfully.");
            } catch (e) {
                console.warn("Could not bind cloud sync (running standalone offline).", e);

            { id: 'ast', label: '+1 AST', category: 'play', stat: 'ast', val: 1, colorClass: 'bg-emerald-700 hover:bg-emerald-600 text-white border-emerald-600 shadow-sm' },
            { id: 'reb', label: '+1 REB', category: 'play', stat: 'reb', val: 1, colorClass: 'bg-emerald-700 hover:bg-emerald-600 text-white border-emerald-600 shadow-sm' },
            { id: 'stl', label: '+1 STL', category: 'play', stat: 'stl', val: 1, colorClass: 'bg-emerald-700 hover:bg-emerald-600 text-white border-emerald-600 shadow-sm' },
            { id: 'blk', label: '+1 BLK', category: 'play', stat: 'blk', val: 1, colorClass: 'bg-emerald-700 hover:bg-emerald-600 text-white border-emerald-600 shadow-sm' },
            
            { id: 'fg2m_miss', label: '2pt Miss', category: 'miss', stat: 'fg2m_miss', val: 1, colorClass: 'bg-red-600 hover:bg-red-500 text-white border-red-500 shadow-md' },
            { id: 'fg3m_miss', label: '3pt Miss', category: 'miss', stat: 'fg3m_miss', val: 1, colorClass: 'bg-red-600 hover:bg-red-500 text-white border-red-500 shadow-md' },
            { id: 'to', label: '+1 TO', category: 'deficit', stat: 'to', val: 1, colorClass: 'bg-red-700 hover:bg-red-600 text-white border-red-600 shadow-sm' },
            { id: 'pf', label: '+1 FOUL', category: 'deficit', stat: 'pf', val: 1, colorClass: 'bg-red-800 hover:bg-red-700 text-white border-red-700 shadow-sm' }
        ];

        function App() {
            const [teams, setTeams] = useState([]);
            const [games, setGames] = useState([]);
            const [activeTab, setActiveTab] = useState('live');
            const [toast, setToast] = useState(null);

            const [isGameLive, setIsGameLive] = useState(false);
            const [teamAId, setTeamAId] = useState("");
            const [teamBId, setTeamBId] = useState("");
            const [teamAScore, setTeamAScore] = useState(0);
            const [teamBScore, setTeamBScore] = useState(0);
            
            const [teamALineup, setTeamALineup] = useState([]);
            const [teamABench, setTeamABench] = useState([]);
            const [teamBLineup, setTeamBLineup] = useState([]);
            const [teamBBench, setTeamBBench] = useState([]);
            
            const [liveStats, setLiveStats] = useState({});
            const [gameLog, setGameLog] = useState([]);
            
            const [loggedHistory, setLoggedHistory] = useState([]);
            const [activeAction, setActiveAction] = useState(null); 
            const [correctionMode, setCorrectionMode] = useState(false); 
            const [showLoggingModal, setShowLoggingModal] = useState(false);

            const [activeMobileConsoleTab, setActiveMobileConsoleTab] = useState('home');

            // Historic Boxscore Editing States
            const [editingGame, setEditingGame] = useState(null); 
            const [editStatsTemp, setEditStatsTemp] = useState({}); 
            const [expandedEditPlayerId, setExpandedEditPlayerId] = useState(null);

            const [showNewTeamModal, setShowNewTeamModal] = useState(false);
            const [newTeamName, setNewTeamName] = useState("");
            const [newTeamColor, setNewTeamColor] = useState("#10b981");

            const [showNewPlayerModal, setShowNewPlayerModal] = useState(false);
            const [selectedTeamIdForPlayer, setSelectedTeamIdForPlayer] = useState("");
            const [newPlayerName, setNewPlayerName] = useState("");
            const [newPlayerNumber, setNewPlayerNumber] = useState("");

            const [showSubstitutionModal, setShowSubstitutionModal] = useState(false);
            const [subTargetPlayer, setSubTargetPlayer] = useState(null); 

            // Modal Alert System for 4th and 5th personal fouls
            const [foulAlert, setFoulAlert] = useState(null);

            const [confirmDialog, setConfirmDialog] = useState(null);

            // Filter actions for tiered hierarchy optimization
            const primaryActions = STAT_ACTIONS.filter(act => ['pts_2', 'pts_3', 'fg2m_miss', 'fg3m_miss'].includes(act.id));
            const secondaryActions = STAT_ACTIONS.filter(act => ['reb', 'ast'].includes(act.id));
            const tertiaryActions = STAT_ACTIONS.filter(act => ['pts_1', 'stl', 'blk', 'to', 'pf'].includes(act.id));

            /* Managing body scrolling locks */
            useEffect(() => {
                const isAnyModalOpen = showNewTeamModal || showNewPlayerModal || showSubstitutionModal || showLoggingModal || !!confirmDialog || !!foulAlert;
                if (isAnyModalOpen) {
                    document.body.style.overflow = 'hidden';
                    document.body.style.position = 'fixed';
                    document.body.style.width = '100%';
                } else {
                    document.body.style.overflow = '';
                    document.body.style.position = '';
                    document.body.style.width = '';
                }
                return () => {
                    document.body.style.overflow = '';
                    document.body.style.position = '';
                    document.body.style.width = '';
                };
            }, [showNewTeamModal, showNewPlayerModal, showSubstitutionModal, showLoggingModal, confirmDialog, foulAlert]);

            /* Handling smart CSV rosters parsing */
            const handleImportCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.readAsText(file);
                reader.onload = (event) => {
                    try {
                        const text = event.target.result;
                        const lines = text.split('\n')
                            .map(line => line.split(',')
                                .map(cell => cell.trim().replace(/^["']|["']$/g, ''))
                            )
                            .filter(row => row.length > 1 && row.some(cell => cell !== ""));
                        
                        if (lines.length < 2) {
                            showToast("CSV file is empty or invalid.", "error");
                            return;
                        }
                        
                        const headers = lines[0].map(h => h.toLowerCase().trim().replace(/^["']|["']$/g, ''));
                        const teamIndex = headers.findIndex(h => h.includes('team'));
                        
                        // Explicitly exclude columns with the word "team" when searching for the Player's Name
                        const nameIndex = headers.findIndex(h => 
                            h.includes('player') || 
                            h.includes('athlete') || 
                            h.includes('member') || 
                            (h.includes('name') && !h.includes('team'))
                        );
                        
                        const numberIndex = headers.findIndex(h => h.includes('number') || h.includes('jersey') || h.includes('no') || h === '#');

                        if (teamIndex === -1 || nameIndex === -1) {
                            showToast("CSV must have 'Team' and 'Player Name' columns.", "error");
                            return;
                        }

                        const teamMap = {};
                        const colors = ["#e2e8f0", "#3b82f6", "#475569", "#991b1b", "#8b5cf6", "#ec4899", "#14b8a6", "#f97316"];
                        let colorIdx = 0;

                        for (let i = 1; i < lines.length; i++) {
                            const row = lines[i];
                            if (row.length < Math.max(teamIndex, nameIndex) + 1 || !row[teamIndex] || !row[nameIndex]) continue;

                            const teamName = row[teamIndex];
                            const playerName = row[nameIndex];
                            const playerNo = numberIndex !== -1 && row[numberIndex] ? row[numberIndex] : "0";

                            if (!teamMap[teamName]) {
                                teamMap[teamName] = {
                                    id: `team_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
                                    name: teamName,
                                    color: colors[colorIdx % colors.length],
                                    players: []
                                };
                                colorIdx++;
                            }

                            teamMap[teamName].players.push({
                                id: `player_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
                                name: playerName,
                                number: playerNo,
                                gamesPlayed: 0,
                                totalStats: { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 }
                            });
                        }

                        const parsedTeams = Object.values(teamMap);
                        if (parsedTeams.length === 0) {
                            showToast("No valid rosters found in CSV.", "error");
                            return;
                        }

                        saveTeamState(parsedTeams);
                        showToast(`Imported ${parsedTeams.length} teams from CSV successfully!`, "success");
                    } catch (err) {
                        showToast("Failed to parse CSV file.", "error");
                    }
                };
            };

            /* Integrating data syncing networks & local migrations */
            useEffect(() => {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'wknd-league-stats';

                if (window.firebaseDb) {
                    const { collection, onSnapshot, signInAnonymously, signInWithCustomToken } = window.firebaseUtils;
                    const auth = window.firebaseAuth;

                    const initializeSync = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await signInAnonymously(auth);
                            }
                        } catch (e) {}

                        const teamsPath = collection(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'teams');
                        const unsubTeams = onSnapshot(teamsPath, (snapshot) => {
                            const cloudTeams = [];
                            snapshot.forEach(doc => { cloudTeams.push({ id: doc.id, ...doc.data() }); });
                            if (cloudTeams.length > 0) {
                                setTeams(cloudTeams);
                            } else {
                                setTeams(initialTeams);
                            }
                        });

                        const gamesPath = collection(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'games');
                        const unsubGames = onSnapshot(gamesPath, (snapshot) => {
                            const cloudGames = [];
                            snapshot.forEach(doc => { cloudGames.push({ id: doc.id, ...doc.data() }); });
                            setGames(cloudGames.sort((a, b) => b.id.localeCompare(a.id)));
                        });

                        return () => { unsubTeams(); unsubGames(); };
                    };
                    initializeSync();
                } else {
                    const savedTeams = localStorage.getItem('stat_teams');
                    const savedGames = localStorage.getItem('stat_games');
                    
                    let loadedTeams = savedTeams ? JSON.parse(savedTeams) : initialTeams;
                    // Smart Migration: Force WKND Season 3 defaults if the old placeholders (Apex Thunder) exist
                    if (loadedTeams.some(t => t.name === "Apex Thunder")) {
                        loadedTeams = initialTeams;
                        localStorage.setItem('stat_teams', JSON.stringify(initialTeams));
                    }
                    setTeams(loadedTeams);
                    setGames(savedGames ? JSON.parse(savedGames) : []);
                }

                try {
                    const activeSession = localStorage.getItem('active_live_session');
                    if (activeSession) {
                        const session = JSON.parse(activeSession);
                        setTeamAId(session.teamAId || "");
                        setTeamBId(session.teamBId || "");
                        setTeamAScore(session.teamAScore || 0);
                        setTeamBScore(session.teamBScore || 0);
                        setTeamALineup(session.teamALineup || []);
                        setTeamABench(session.teamABench || []);
                        setTeamBLineup(session.teamBLineup || []);
                        setTeamBBench(session.teamBBench || []);
                        setLiveStats(session.liveStats || {});
                        setGameLog(session.gameLog || []);
                        setLoggedHistory(session.loggedHistory || []);
                        setIsGameLive(true);
                    }
                } catch (e) {}
            }, []);

            useEffect(() => {
                if (!window.firebaseDb && teams.length > 0) {
                    localStorage.setItem('stat_teams', JSON.stringify(teams));
                }
            }, [teams]);

            useEffect(() => {
                if (!window.firebaseDb && games.length > 0) {
                    localStorage.setItem('stat_games', JSON.stringify(games));
                }
            }, [games]);

            useEffect(() => {
                if (isGameLive) {
                    const session = { teamAId, teamBId, teamAScore, teamBScore, teamALineup, teamABench, teamBLineup, teamBBench, liveStats, gameLog, loggedHistory };
                    localStorage.setItem('active_live_session', JSON.stringify(session));
                } else {
                    localStorage.removeItem('active_live_session');
                }
            }, [isGameLive, teamAId, teamBId, teamAScore, teamBScore, teamALineup, teamABench, teamBLineup, teamBBench, liveStats, gameLog, loggedHistory]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const getWallClockTime = () => {
                return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            };

            const saveTeamState = async (updatedTeams) => {
                setTeams(updatedTeams);
                if (window.firebaseDb) {
                    const { doc, setDoc } = window.firebaseUtils;
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'wknd-league-stats';
                    for (const team of updatedTeams) {
                        await setDoc(doc(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'teams', team.id), team);
                    }
                }
            };

            const saveNewGameState = async (newGame, updatedTeams) => {
                setGames(prev => [newGame, ...prev]);
                setTeams(updatedTeams);
                if (window.firebaseDb) {
                    const { doc, setDoc } = window.firebaseUtils;
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'wknd-league-stats';
                    await setDoc(doc(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'games', newGame.id), newGame);
                    for (const team of updatedTeams) {
                        await setDoc(doc(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'teams', team.id), team);
                    }
                }
            };

            /* HELPER FUNCTIONS FOR FILE DATABASE HANDLERS */
            const handleExportData = () => {
                try {
                    const backupData = { teams, games };
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `league_stats_backup_${new Date().toISOString().split('T')[0]}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                    showToast("Database backup file downloaded!", "success");
                } catch (e) {
                    showToast("Failed to export database.", "error");
                }
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const fileReader = new FileReader();
                fileReader.readAsText(file, "UTF-8");
                fileReader.onload = (event) => {
                    try {
                        const parsedData = JSON.parse(event.target.result);
                        if (parsedData && Array.isArray(parsedData.teams)) {
                            saveTeamState(parsedData.teams);
                            if (Array.isArray(parsedData.games)) {
                                setGames(parsedData.games);
                                if (!window.firebaseDb) {
                                    localStorage.setItem('stat_games', JSON.stringify(parsedData.games));
                                }
                            }
                            showToast("Database backup successfully restored!", "success");
                        }
                    } catch (err) {
                        showToast("Failed to parse system backup file.", "error");
                    }
                };
            };

            const handleExportRostersOnly = () => {
                try {
                    const rostersOnly = teams.map(t => ({
                        id: t.id,
                        name: t.name,
                        color: t.color,
                        players: t.players.map(p => ({
                            id: p.id,
                            name: p.name,
                            number: p.number,
                            gamesPlayed: 0,
                            totalStats: { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 }
                        }))
                    }));
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(rostersOnly));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `league_rosters_${new Date().toISOString().split('T')[0]}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                    showToast("Roster templates exported!", "success");
                } catch (e) {
                    showToast("Failed to compile roster export.", "error");
                }
            };

            const handleImportRostersOnly = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const fileReader = new FileReader();
                fileReader.readAsText(file, "UTF-8");
                fileReader.onload = (event) => {
                    try {
                        const parsedRosters = JSON.parse(event.target.result);
                        if (parsedRosters && Array.isArray(parsedRosters)) {
                            saveTeamState(parsedRosters);
                            showToast("Team rosters imported!", "success");
                        }
                    } catch (err) {
                        showToast("Failed to process roster upload.", "error");
                    }
                };
            };

            const handleStartMatch = (e) => {
                e.preventDefault();
                if (!teamAId || !teamBId || teamAId === teamBId) return;

                const teamAObj = teams.find(t => t.id === teamAId);
                const teamBObj = teams.find(t => t.id === teamBId);
                if (!teamAObj || !teamBObj || teamAObj.players.length === 0 || teamBObj.players.length === 0) return;

                const startersA = teamAObj.players.slice(0, 5).map(p => p.id);
                const benchA = teamAObj.players.slice(5).map(p => p.id);
                const startersB = teamBObj.players.slice(0, 5).map(p => p.id);
                const benchB = teamBObj.players.slice(5).map(p => p.id);

                setTeamALineup(startersA);
                setTeamABench(benchA);
                setTeamBLineup(startersB);
                setTeamBBench(benchB);

                const initializedStats = {};
                teamAObj.players.forEach(p => { initializedStats[p.id] = { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 }; });
                teamBObj.players.forEach(p => { initializedStats[p.id] = { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 }; });

                setLiveStats(initializedStats);
                setTeamAScore(0);
                setTeamBScore(0);
                setActiveAction(null);
                setCorrectionMode(false);
                setLoggedHistory([]);
                setGameLog([{ time: getWallClockTime(), text: `Match initialized: ${teamAObj.name} vs ${teamBObj.name}` }]);
                setIsGameLive(true);
            };

            const handlePlayerClick = (playerId, isTeamA) => {
                if (!activeAction) return;

                const multiplier = correctionMode ? -1 : 1;
                const changeAmount = activeAction.val * multiplier;
                const statField = activeAction.stat;
                const attachedTrackingStat = activeAction.trackingStat;

                const playerObj = teams.flatMap(t => t.players).find(p => p.id === playerId);
                let logText = "";
                if (playerObj) {
                    if (correctionMode) {
                        logText = `🔄 CORRECTION: ${playerObj.name} stat adjusted`;
                    } else {
                        logText = `⚡ ${playerObj.name}: ${activeAction.label}`;
                    }
                }

                // Foul warnings & DQ logic
                if (statField === 'pf' && !correctionMode) {
                    const currentFouls = liveStats[playerId]?.pf || 0;
                    const nextFouls = currentFouls + changeAmount;
                    if (nextFouls === 4) {
                        setFoulAlert({ playerName: playerObj.name, number: playerObj.number, fouls: 4, type: 'warning' });
                    } else if (nextFouls >= 5) {
                        setFoulAlert({ playerName: playerObj.name, number: playerObj.number, fouls: 5, type: 'disqualified' });
                    }
                }

                const logWithTag = `[${isTeamA ? 'HOME' : 'AWAY'}] ${logText}`;

                setLoggedHistory(prev => [{ playerId, statField, changeAmount, attachedTrackingStat, previousTeamAScore: teamAScore, previousTeamBScore: teamBScore, logText: logWithTag }, ...prev]);

                setLiveStats(prev => {
                    const currentVal = prev[playerId]?.[statField] || 0;
                    const newVal = Math.max(0, currentVal + changeAmount);
                    let playerUpdate = { ...prev[playerId], [statField]: newVal };

                    if (attachedTrackingStat) {
                        const currentTrackVal = prev[playerId]?.[attachedTrackingStat] || 0;
                        playerUpdate[attachedTrackingStat] = Math.max(0, currentTrackVal + (1 * multiplier));
                    }

                    const updated = { ...prev, [playerId]: playerUpdate };
                    let totalA = 0, totalB = 0;
                    const teamAObj = teams.find(t => t.id === teamAId);
                    const teamBObj = teams.find(t => t.id === teamBId);

                    if (teamAObj) teamAObj.players.forEach(p => { totalA += updated[p.id]?.pts || 0; });
                    if (teamBObj) teamBObj.players.forEach(p => { totalB += updated[p.id]?.pts || 0; });

                    setTeamAScore(totalA);
                    setTeamBScore(totalB);
                    return updated;
                });

                setGameLog(prev => [{ time: getWallClockTime(), text: logWithTag }, ...prev.slice(0, 50)]);
                setActiveAction(null);
                setCorrectionMode(false);
                setShowLoggingModal(false);
            };

            const handleUndo = () => {
                if (loggedHistory.length === 0) return;
                const [lastAction, ...remainingHistory] = loggedHistory;
                setLoggedHistory(remainingHistory);

                setLiveStats(prev => {
                    const currentPlayerStats = prev[lastAction.playerId];
                    if (!currentPlayerStats) return prev;
                    let restoredPlayerStats = { ...currentPlayerStats, [lastAction.statField]: Math.max(0, (currentPlayerStats[lastAction.statField] || 0) - lastAction.changeAmount) };
                    if (lastAction.attachedTrackingStat) {
                        const trackingDecrement = lastAction.changeAmount > 0 ? 1 : -1;
                        restoredPlayerStats[lastAction.attachedTrackingStat] = Math.max(0, (currentPlayerStats[lastAction.attachedTrackingStat] || 0) - trackingDecrement);
                    }
                    return { ...prev, [lastAction.playerId]: restoredPlayerStats };
                });

                setTeamAScore(lastAction.previousTeamAScore);
                setTeamBScore(lastAction.previousTeamBScore);
                setGameLog(prev => prev.filter(log => log.text !== lastAction.logText));
            };

            const triggerSubModal = (playerId, isTeamA) => {
                const playerObj = teams.flatMap(t => t.players).find(p => p.id === playerId);
                if (!playerObj) return;
                setSubTargetPlayer({ id: playerId, name: playerObj.name, number: playerObj.number, team: isTeamA ? 'A' : 'B' });
                setShowSubstitutionModal(true);
            };

            const executeSubstitution = (outId, inId, isTeamA) => {
                if (isTeamA) {
                    setTeamALineup(prev => prev.map(id => id === outId ? inId : id));
                    setTeamABench(prev => prev.map(id => id === inId ? outId : id));
                } else {
                    setTeamBLineup(prev => prev.map(id => id === outId ? inId : id));
                    setTeamBBench(prev => prev.map(id => id === inId ? outId : id));
                }
                setShowSubstitutionModal(false);
                setSubTargetPlayer(null);
            };

            const handleSaveHistoricEdit = (e) => {
                e.preventDefault();
                if (!editingGame) return;

                let newTeamAScore = 0;
                let newTeamBScore = 0;
                const teamAObj = teams.find(t => t.id === editingGame.teamAId);
                const teamBObj = teams.find(t => t.id === editingGame.teamBId);

                if (teamAObj) {
                    teamAObj.players.forEach(p => {
                        newTeamAScore += parseInt(editStatsTemp[p.id]?.pts || 0, 10);
                    });
                }
                if (teamBObj) {
                    teamBObj.players.forEach(p => {
                        newTeamBScore += parseInt(editStatsTemp[p.id]?.pts || 0, 10);
                    });
                }

                const updatedTeams = teams.map(t => {
                    if (t.id !== editingGame.teamAId && t.id !== editingGame.teamBId) return t;

                    const updatedPlayers = t.players.map(p => {
                        const oldPStats = editingGame.playerStats[p.id] || { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 };
                        const newPStats = editStatsTemp[p.id] || { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 };

                        const delta = (field) => parseInt(newPStats[field] || 0, 10) - parseInt(oldPStats[field] || 0, 10);

                        return {
                            ...p,
                            totalStats: {
                                pts: Math.max(0, (p.totalStats.pts || 0) + delta('pts')),
                                ast: Math.max(0, (p.totalStats.ast || 0) + delta('ast')),
                                reb: Math.max(0, (p.totalStats.reb || 0) + delta('reb')),
                                stl: Math.max(0, (p.totalStats.stl || 0) + delta('stl')),
                                blk: Math.max(0, (p.totalStats.blk || 0) + delta('blk')),
                                to: Math.max(0, (p.totalStats.to || 0) + delta('to')),
                                pf: Math.max(0, (p.totalStats.pf || 0) + delta('pf')),
                                fg2m: Math.max(0, (p.totalStats.fg2m || 0) + delta('fg2m')),
                                fg3m: Math.max(0, (p.totalStats.fg3m || 0) + delta('fg3m')),
                                fg2m_miss: Math.max(0, (p.totalStats.fg2m_miss || 0) + delta('fg2m_miss')),
                                fg3m_miss: Math.max(0, (p.totalStats.fg3m_miss || 0) + delta('fg3m_miss'))
                            }
                        };
                    });
                    return { ...t, players: updatedPlayers };
                });

                const updatedGames = games.map(g => {
                    if (g.id === editingGame.id) {
                        return {
                            ...g,
                            teamAScore: newTeamAScore,
                            teamBScore: newTeamBScore,
                            playerStats: editStatsTemp
                        };
                    }
                    return g;
                });

                setGames(updatedGames);
                saveTeamState(updatedTeams);

                if (!window.firebaseDb) {
                    localStorage.setItem('stat_games', JSON.stringify(updatedGames));
                } else {
                    const { doc, setDoc } = window.firebaseUtils;
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'wknd-league-stats';
                    setDoc(doc(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'games', editingGame.id), {
                        ...editingGame,
                        teamAScore: newTeamAScore,
                        teamBScore: newTeamBScore,
                        playerStats: editStatsTemp
                    });
                }

                setEditingGame(null);
                setExpandedEditPlayerId(null);
                showToast("Box score updated and career averages recalculated!", "success");
            };

            const handleResetMatch = () => {
                setConfirmDialog({
                    title: "Clear & Restart Match?",
                    text: "This will permanently wipe all current scores, timeline logs, and active stats back to 0. Competing teams will remain selected.",
                    onConfirm: () => {
                        const teamAObj = teams.find(t => t.id === teamAId);
                        const teamBObj = teams.find(t => t.id === teamBId);
                        if (!teamAObj || !teamBObj) return;

                        const startersA = teamAObj.players.slice(0, 5).map(p => p.id);
                        const benchA = teamAObj.players.slice(5).map(p => p.id);
                        const startersB = teamBObj.players.slice(0, 5).map(p => p.id);
                        const benchB = teamBObj.players.slice(5).map(p => p.id);

                        setTeamALineup(startersA);
                        setTeamABench(benchA);
                        setTeamBLineup(startersB);
                        setTeamBBench(benchB);

                        const initializedStats = {};
                        teamAObj.players.forEach(p => { initializedStats[p.id] = { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 }; });
                        teamBObj.players.forEach(p => { initializedStats[p.id] = { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 }; });

                        setLiveStats(initializedStats);
                        setTeamAScore(0);
                        setTeamBScore(0);
                        setActiveAction(null);
                        setCorrectionMode(false);
                        setLoggedHistory([]);
                        setGameLog([{ time: getWallClockTime(), text: `Match restarted: ${teamAObj.name} vs ${teamBObj.name}` }]);
                        setConfirmDialog(null);
                        showToast("Current game stats cleared! Ready to restart.", "info");
                    }
                });
            };

            const handleMergeData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const fileReader = new FileReader();
                fileReader.readAsText(file, "UTF-8");
                fileReader.onload = (event) => {
                    try {
                        const parsedData = JSON.parse(event.target.result);
                        if (!parsedData || !Array.isArray(parsedData.teams) || !Array.isArray(parsedData.games)) return;

                        const newGames = parsedData.games.filter(ig => !games.some(lg => lg.id === ig.id));
                        if (newGames.length === 0) {
                            showToast("No new game records found to merge.", "info");
                            return;
                        }

                        let mergedTeams = JSON.parse(JSON.stringify(teams));

                        parsedData.teams.forEach(importedTeam => {
                            if (!mergedTeams.some(localTeam => localTeam.id === importedTeam.id)) {
                                mergedTeams.push(importedTeam);
                            }
                        });

                        parsedData.teams.forEach(importedTeam => {
                            const localTeam = mergedTeams.find(t => t.id === importedTeam.id);
                            if (localTeam) {
                                importedTeam.players.forEach(importedPlayer => {
                                    if (!localTeam.players.some(p => p.id === importedPlayer.id)) {
                                        const newPlayerObj = {
                                            ...importedPlayer,
                                            gamesPlayed: 0,
                                            totalStats: { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 }
                                        };
                                        localTeam.players.push(newPlayerObj);
                                    }
                                });
                            }
                        });

                        newGames.forEach(game => {
                            Object.entries(game.playerStats).forEach(([playerId, stats]) => {
                                let foundPlayer = null;
                                for (let t of mergedTeams) {
                                    foundPlayer = t.players.find(p => p.id === playerId);
                                    if (foundPlayer) break;
                                }

                                if (foundPlayer) {
                                    foundPlayer.gamesPlayed += 1;
                                    foundPlayer.totalStats.pts += (stats.pts || 0);
                                    foundPlayer.totalStats.ast += (stats.ast || 0);
                                    foundPlayer.totalStats.reb += (stats.reb || 0);
                                    foundPlayer.totalStats.stl += (stats.stl || 0);
                                    foundPlayer.totalStats.blk += (stats.blk || 0);
                                    foundPlayer.totalStats.to += (stats.to || 0);
                                    foundPlayer.totalStats.pf += (stats.pf || 0);
                                    foundPlayer.totalStats.fg2m = (foundPlayer.totalStats.fg2m || 0) + (stats.fg2m || 0);
                                    foundPlayer.totalStats.fg3m = (foundPlayer.totalStats.fg3m || 0) + (stats.fg3m || 0);
                                    foundPlayer.totalStats.fg2m_miss = (foundPlayer.totalStats.fg2m_miss || 0) + (stats.fg2m_miss || 0);
                                    foundPlayer.totalStats.fg3m_miss = (foundPlayer.totalStats.fg3m_miss || 0) + (stats.fg3m_miss || 0);
                                }
                            });
                        });

                        const mergedGames = [...newGames, ...games].sort((a, b) => b.id.localeCompare(a.id));
                        saveTeamState(mergedTeams);
                        setGames(mergedGames);
                        if (!window.firebaseDb) {
                            localStorage.setItem('stat_games', JSON.stringify(mergedGames));
                        }
                        showToast(`Merged ${newGames.length} new game(s)!`, "success");
                    } catch (err) {
                        showToast("Failed to complete data merge.", "error");
                    }
                };
            };

            const handleCreateTeam = (e) => {
                e.preventDefault();
                if (!newTeamName.trim()) return;
                const newTeam = { id: `team_${Date.now()}`, name: newTeamName.trim(), color: newTeamColor, players: [] };
                saveTeamState([...teams, newTeam]);
                setNewTeamName("");
                setShowNewTeamModal(false);
            };

            const handleCreatePlayer = (e) => {
                e.preventDefault();
                if (!newPlayerName.trim() || !newPlayerNumber.trim() || !selectedTeamIdForPlayer) return;
                const newPlayer = { id: `player_${Date.now()}`, name: newPlayerName.trim(), number: newPlayerNumber.trim(), gamesPlayed: 0, totalStats: { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 } };
                const updatedTeams = teams.map(t => t.id === selectedTeamIdForPlayer ? { ...t, players: [...t.players, newPlayer] } : t);
                saveTeamState(updatedTeams);
                setNewPlayerName("");
                setNewPlayerNumber("");
                setShowNewPlayerModal(false);
            };

            const computeShootingPercentages = (stats) => {
                const totalMade = (stats.fg2m || 0) + (stats.fg3m || 0);
                const totalAttempts = totalMade + (stats.fg2m_miss || 0) + (stats.fg3m_miss || 0);
                const total3PtAttempts = (stats.fg3m || 0) + (stats.fg3m_miss || 0);
                return {
                    fgPct: totalAttempts === 0 ? "0%" : `${Math.round((totalMade / totalAttempts) * 100)}%`,
                    fg3Pct: total3PtAttempts === 0 ? "0%" : `${Math.round(((stats.fg3m || 0) / total3PtAttempts) * 100)}%`
                };
            };

            const getAverages = (player) => {
                const gp = player.gamesPlayed || 0;
                const stats = player.totalStats || {};
                if (gp === 0) return { pts: '0.0', ast: '0.0', reb: '0.0', stl: '0.0', blk: '0.0', to: '0.0', pf: '0.0', fgPct: '0%', fg3Pct: '0%', spg: '0.0', bpg: '0.0' };
                const pctSummary = computeShootingPercentages(stats);
                return {
                    pts: ((stats.pts || 0) / gp).toFixed(1),
                    ast: ((stats.ast || 0) / gp).toFixed(1),
                    reb: ((stats.reb || 0) / gp).toFixed(1),
                    stl: ((stats.stl || 0) / gp).toFixed(1),
                    blk: ((stats.blk || 0) / gp).toFixed(1),
                    to: ((stats.to || 0) / gp).toFixed(1),
                    pf: ((stats.pf || 0) / gp).toFixed(1),
                    fgPct: pctSummary.fgPct,
                    fg3Pct: pctSummary.fg3Pct,
                    spg: ((stats.stl || 0) / gp).toFixed(1),
                    bpg: ((stats.blk || 0) / gp).toFixed(1)
                };
            };

            const renderPlayerCompactRow = (playerId, isTeamA) => {
                const teamObj = isTeamA ? teams.find(t => t.id === teamAId) : teams.find(t => t.id === teamBId);
                const player = teams.flatMap(t => t.players).find(p => p.id === playerId);
                if (!player) return null;
                const stats = liveStats[playerId] || { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 };
                const currentPct = computeShootingPercentages(stats);
                const hasActionArmed = activeAction !== null;

                const isWarning = stats.pf === 4;
                const isDisqualified = stats.pf >= 5;

                return (
                    <div 
                        key={player.id} 
                        onClick={() => hasActionArmed && handlePlayerClick(player.id, isTeamA)}
                        className={`bg-slate-950/90 border p-3 rounded-xl flex items-center justify-between gap-2 ${
                            hasActionArmed 
                            ? 'armed-target hover:bg-slate-900 border-emerald-500/50' 
                            : 'border-slate-800 hover:border-slate-700/60'
                        } ${isDisqualified ? 'opacity-40 bg-slate-950/60' : ''}`}
                    >
                        <div className="flex items-center gap-2 min-w-0">
                            <span className="font-mono text-xs font-bold text-slate-400 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">#{player.number}</span>
                            <div className="min-w-0">
                                <span className="font-extrabold text-xs text-white truncate block">{player.name}</span>
                                <div className="flex gap-1 mt-0.5">
                                    {isDisqualified && <span className="px-1 py-0.5 bg-red-955 text-red-400 text-[8px] font-black border border-red-900 rounded uppercase">OUT</span>}
                                    {isWarning && <span className="px-1 py-0.5 bg-amber-955 text-amber-400 text-[8px] font-black border border-amber-800 rounded uppercase">4 PF</span>}
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); triggerSubModal(player.id, isTeamA); }}
                                        className="text-[9px] text-orange-400 hover:text-orange-300 font-bold flex items-center gap-0.5 cursor-pointer"
                                    >
                                        Sub
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 flex-shrink-0">
                            <div className="flex gap-1.5 text-[10px] font-mono bg-slate-900 px-2 py-1 rounded border border-slate-800 text-slate-400">
                                <span>P: <strong className="text-white">{stats.pts}</strong></span>
                                <span>R: <strong className="text-white">{stats.reb}</strong></span>
                                <span>A: <strong className="text-white">{stats.ast}</strong></span>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-4 md:py-8">
                    
                    {/* LEAGUE HEADER */}
                    <header className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-4 border-b border-slate-800 pb-4">
                        <div>
                            <h1 className="text-xl md:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-orange-400 to-amber-300 bg-clip-text text-transparent">WKND League Stats</h1>
                        </div>

                        {/* NAV CONTROL TABS */}
                        <nav className="flex bg-slate-900 p-1 rounded-xl border border-slate-800 gap-0.5">
                            <button onClick={() => setActiveTab('live')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 cursor-pointer ${activeTab === 'live' ? 'bg-orange-500 text-white shadow-lg' : 'text-slate-400'}`}><Icons.Activity /> Console</button>
                            <button onClick={() => setActiveTab('teams')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 cursor-pointer ${activeTab === 'teams' ? 'bg-orange-500 text-white shadow-lg' : 'text-slate-400'}`}><Icons.Users /> Teams</button>
                            <button onClick={() => setActiveTab('history')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 cursor-pointer ${activeTab === 'history' ? 'bg-orange-500 text-white shadow-lg' : 'text-slate-400'}`}><Icons.History /> History</button>
                            <button onClick={() => setActiveTab('leaders')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 cursor-pointer ${activeTab === 'leaders' ? 'bg-orange-500 text-white shadow-lg' : 'text-slate-400'}`}><Icons.Trophy /> Leaders</button>
                        </nav>
                    </header>

                    {/* MAIN DECK */}
                    <main>
                        {/* TAB 1: DUAL CONSOLE WITH TIERED BUTTON HIERARCHY */}
                        {activeTab === 'live' && (
                            <div>
                                {!isGameLive ? (
                                    <div className="max-w-xl mx-auto bg-slate-900/65 rounded-2xl border border-slate-800 p-6 shadow-2xl mt-4">
                                        <form onSubmit={handleStartMatch} className="space-y-4">
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-slate-400 text-xs font-bold mb-1 uppercase">Home (A)</label>
                                                    <select value={teamAId} onChange={(e) => setTeamAId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-xs focus:outline-none" required>
                                                        <option value="">-- Select --</option>
                                                        {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-slate-400 text-xs font-bold mb-1 uppercase">Away (B)</label>
                                                    <select value={teamBId} onChange={(e) => setTeamBId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-xs focus:outline-none" required>
                                                        <option value="">-- Select --</option>
                                                        {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <button type="submit" className="w-full bg-orange-500 font-bold py-2.5 rounded-xl text-xs text-white cursor-pointer shadow-lg">Start Live Tracking Match</button>
                                        </form>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                                        {/* COMPACT MOBILE SCOREBAR */}
                                        <div className="col-span-12 bg-slate-900 border border-slate-800 p-2 rounded-xl shadow-xl">
                                            <div className="grid grid-cols-7 items-center bg-slate-950 border border-slate-900 px-3 py-1.5 rounded-lg">
                                                <div className="col-span-3 text-center">
                                                    <span className="text-[10px] text-slate-400 font-bold block truncate">{teams.find(t => t.id === teamAId)?.name}</span>
                                                    <div className="text-xl font-mono font-black text-white">{teamAScore}</div>
                                                </div>
                                                <div className="col-span-1 text-center text-slate-600 font-black font-mono text-xs">VS</div>
                                                <div className="col-span-3 text-center">
                                                    <span className="text-[10px] text-slate-400 font-bold block truncate">{teams.find(t => t.id === teamBId)?.name}</span>
                                                    <div className="text-xl font-mono font-black text-white">{teamBScore}</div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* QUICK ACTION DECK GRID WITH RESPONSIVE DISPLAY & TIERED PRIORITY */}
                                        <div className="col-span-12 bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-xl space-y-4">
                                            <div className="flex justify-between items-center border-b border-slate-800 pb-1.5">
                                                <span className="text-[10px] text-emerald-400 uppercase tracking-wider font-extrabold flex items-center gap-1"><Icons.Zap /> Tap action first, then select player on court</span>
                                                <div className="flex gap-2">
                                                    <button onClick={handleUndo} disabled={loggedHistory.length === 0} className="px-2 py-0.5 rounded bg-amber-500/10 border border-amber-500/30 text-amber-400 text-[10px] font-bold cursor-pointer">Undo</button>
                                                    <button onClick={() => setCorrectionMode(!correctionMode)} className={`px-2 py-0.5 rounded text-[10px] font-bold border cursor-pointer ${correctionMode ? 'bg-red-955 text-red-400 border-red-700' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>Correction</button>
                                                </div>
                                            </div>

                                            {/* TIER 1: GIANT PRIMARY KEYS (Shooting metrics) */}
                                            <div>
                                                <span className="text-[9px] text-slate-400 font-extrabold uppercase tracking-widest block mb-2">🏀 Tier 1: Primary Shooting Keys (Most Common)</span>
                                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                                    {primaryActions.map(act => (
                                                        <button 
                                                            key={act.id} 
                                                            onClick={() => { setActiveAction(act); setShowLoggingModal(true); }} 
                                                            className={`py-5 md:py-6 px-4 rounded-2xl text-center text-sm font-black tracking-wide border transition-all active:scale-95 cursor-pointer shadow-lg uppercase ${act.colorClass} border-transparent`}
                                                        >
                                                            {act.label}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* TIER 2 & TIER 3 COMBINED CONTAINER */}
                                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                                                {/* TIER 2: LARGE SECONDARY KEYS (Rebounds & Assists) */}
                                                <div className="lg:col-span-5">
                                                    <span className="text-[9px] text-slate-400 font-extrabold uppercase tracking-widest block mb-2">🛡️ Tier 2: Transition Keys (Very Common)</span>
                                                    <div className="grid grid-cols-2 gap-3">
                                                        {secondaryActions.map(act => (
                                                            <button 
                                                                key={act.id} 
                                                                onClick={() => { setActiveAction(act); setShowLoggingModal(true); }} 
                                                                className={`py-4 px-4 rounded-xl text-center text-xs font-black border transition-all active:scale-95 cursor-pointer shadow-md uppercase ${act.colorClass} border-transparent`}
                                                            >
                                                                {act.label}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                {/* TIER 3: COMPACT TERTIARY KEYS (Others) */}
                                                <div className="lg:col-span-7">
                                                    <span className="text-[9px] text-slate-400 font-extrabold uppercase tracking-widest block mb-2">⚙️ Tier 3: Auxiliary Game Events</span>
                                                    <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
                                                        {tertiaryActions.map(act => (
                                                            <button 
                                                                key={act.id} 
                                                                onClick={() => { setActiveAction(act); setShowLoggingModal(true); }} 
                                                                className={`py-2.5 px-2 rounded-lg text-center text-[10px] font-bold border transition-all active:scale-95 cursor-pointer shadow-sm ${act.colorClass} border-transparent`}
                                                            >
                                                                {act.label}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Mobile Tab Toggles */}
                                        <div className="col-span-12 md:hidden flex bg-slate-950 p-1 rounded-xl border border-slate-855 gap-1">
                                            <button onClick={() => setActiveMobileConsoleTab('home')} className={`flex-1 py-1.5 text-center text-xs font-bold rounded-lg ${activeMobileConsoleTab === 'home' ? 'bg-slate-800 text-white' : 'text-slate-400'}`}>🏠 Home lineup</button>
                                            <button onClick={() => setActiveMobileConsoleTab('away')} className={`flex-1 py-1.5 text-center text-xs font-bold rounded-lg ${activeMobileConsoleTab === 'away' ? 'bg-slate-800 text-white' : 'text-slate-400'}`}>🚌 Away lineup</button>
                                        </div>

                                        {/* Main Courtside tracking zones */}
                                        <div className="col-span-12 lg:col-span-9 grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className={`bg-slate-900/80 border border-slate-800 p-3 rounded-xl space-y-2 ${activeMobileConsoleTab === 'home' ? 'block' : 'hidden md:block'}`}>
                                                <div className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1">ON COURT - HOME</div>
                                                <div className="space-y-1.5">{teamALineup.map(id => renderPlayerCompactRow(id, true))}</div>
                                            </div>
                                            <div className={`bg-slate-900/80 border border-slate-800 p-3 rounded-xl space-y-2 ${activeMobileConsoleTab === 'away' ? 'block' : 'hidden md:block'}`}>
                                                <div className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1">ON COURT - AWAY</div>
                                                <div className="space-y-1.5">{teamBLineup.map(id => renderPlayerCompactRow(id, false))}</div>
                                            </div>
                                        </div>

                                        {/* Sidebar Action Logger */}
                                        <div className="col-span-12 lg:col-span-3 space-y-4 flex flex-col justify-between">
                                            <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex-1 max-h-[180px] overflow-y-auto font-mono text-[10px]">
                                                {gameLog.map((log, idx) => <div key={idx} className="border-b border-slate-850 py-1 text-slate-300"><span className="text-amber-500">[{log.time.split(' ')[0]}]</span> {log.text}</div>)}
                                            </div>
                                            
                                            <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl md:rounded-2xl space-y-3">
                                                <div className="space-y-1.5">

                                            ) : null;
                                        });
                                    })()}
                                </div>
                                <button onClick={() => setShowSubstitutionModal(false)} className="w-full mt-3 py-2 bg-slate-950 text-slate-400 border border-slate-855 text-xs rounded-xl cursor-pointer">Cancel</button>
                            </div>
                        </div>
                    )}

                    {/* RECONFIGURED SINGLE TAP WORKFLOW MODAL DIALOG CONTAINER */}
                    {showLoggingModal && activeAction && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-2xl shadow-2xl relative my-auto">
                                <div className="text-center mb-3">
                                    <h3 className="text-sm font-black text-white">Record Action: <span className="text-emerald-400 font-mono">{activeAction.label}</span></h3>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-855">
                                        <div className="font-extrabold text-[10px] text-slate-400 mb-2 uppercase">Home On Court</div>
                                        <div className="space-y-1.5">
                                            {teamALineup.map(id => {
                                                const p = teams.flatMap(t => t.players).find(x => x.id === id);
                                                return p ? <button key={id} onClick={() => handlePlayerClick(id, true)} className="w-full p-2.5 bg-slate-900 border border-slate-800 text-left text-xs text-white font-bold rounded-xl hover:border-emerald-500 transition-colors">#{p.number} {p.name}</button> : null;
                                            })}
                                        </div>
                                    </div>
                                    <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-855">
                                        <div className="font-extrabold text-[10px] text-slate-400 mb-2 uppercase">Away On Court</div>
                                        <div className="space-y-1.5">
                                            {teamBLineup.map(id => {
                                                const p = teams.flatMap(t => t.players).find(x => x.id === id);
                                                return p ? <button key={id} onClick={() => handlePlayerClick(id, false)} className="w-full p-2.5 bg-slate-900 border border-slate-800 text-left text-xs text-white font-bold rounded-xl hover:border-emerald-500 transition-colors">#{p.number} {p.name}</button> : null;
                                            })}
                                        </div>
                                    </div>
                                </div>
                                <button onClick={() => { setShowLoggingModal(false); setActiveAction(null); setCorrectionMode(false); }} className="w-full mt-4 py-2 bg-slate-950 text-slate-400 text-xs rounded-xl font-bold cursor-pointer">Cancel Action</button>
                            </div>
                        </div>
                    )}

                    {/* FOUL WARNING MODAL OVERLAY */}
                    {foulAlert && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className={`border p-6 rounded-2xl w-full max-w-sm shadow-2xl relative text-center my-auto ${
                                foulAlert.type === 'disqualified' ? 'bg-red-950/90 border-red-500' : 'bg-amber-955 border-amber-700'
                            }`}>
                                <div className="text-4xl mb-3">
                                    {foulAlert.type === 'disqualified' ? '🚨' : '⚠️'}
                                </div>
                                <h3 className="text-lg font-black text-white uppercase tracking-wider mb-2">
                                    {foulAlert.type === 'disqualified' ? 'Fouled Out (Disqualified)' : 'Foul Trouble Warning'}
                                </h3>
                                <p className="text-sm text-slate-200 leading-relaxed mb-4">
                                    <strong className="text-white">#{foulAlert.number} {foulAlert.playerName}</strong> has reached <strong className="text-orange-400">{foulAlert.fouls} personal fouls</strong>.
                                    {foulAlert.type === 'disqualified' 
                                        ? ' This player has officially fouled out and must be substituted off the court.' 
                                        : ' They are now in severe foul trouble and are only one foul away from disqualification.'}
                                </p>
                                <button 
                                    onClick={() => setFoulAlert(null)}
                                    className={`w-full py-2.5 rounded-xl text-xs font-bold text-white transition-colors cursor-pointer ${
                                        foulAlert.type === 'disqualified' ? 'bg-red-600 hover:bg-red-500' : 'bg-amber-600 hover:bg-amber-500'
                                    }`}
                                >
                                    Acknowledge Alert
                                </button>
                            </div>
                        </div>
                    )}

                    {confirmDialog && (
                        <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-sm relative">
                                <h3 className="text-md font-extrabold text-white mb-2">{confirmDialog.title}</h3>
                                <p className="text-xs text-slate-400 mb-4">{confirmDialog.text}</p>
                                <div className="flex gap-3 text-xs font-bold">
                                    <button onClick={() => setConfirmDialog(null)} className="flex-1 py-2 bg-slate-950 text-slate-400 rounded-xl border border-slate-850 cursor-pointer">Cancel</button>
                                    <button onClick={confirmDialog.onConfirm} className="flex-1 py-2 bg-red-600 text-white rounded-xl cursor-pointer">Confirm</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
