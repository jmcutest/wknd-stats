<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WKND League Stats</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel CDN for JSX Parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19; /* Darker Midnight Slate */
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        /* Animated pulsing ring for armed action state */
        @keyframes targetPulse {
            0%, 100% { border-color: rgba(16, 185, 129, 0.4); box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.2); }
            50% { border-color: rgba(16, 185, 129, 0.9); box-shadow: 0 0 10px 3px rgba(16, 185, 129, 0.4); }
        }
        .armed-target {
            animation: targetPulse 1.8s infinite ease-in-out;
            cursor: pointer;
        }
    </style>
</head>
<body class="min-h-screen">

    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Detect if loaded in live sync environment
        const hasFirebaseConfig = typeof __firebase_config !== 'undefined';
        if (hasFirebaseConfig) {
            try {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);
                
                window.firebaseApp = app;
                window.firebaseDb = db;
                window.firebaseAuth = auth;
                window.firebaseUtils = { doc, setDoc, getDoc, onSnapshot, collection, deleteDoc, signInAnonymously, signInWithCustomToken };
                console.log("Real-time cloud database initialized successfully.");
            } catch (e) {
                console.warn("Could not bind cloud sync (running standalone offline).", e);
            }
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icons = {
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Minus: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>,
            Trophy: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34"/></svg>,
            History: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
            ShieldAlert: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
            ChevronRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>,
            UserPlus: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>,
            FolderPlus: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>,
            ArrowRightLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/></svg>,
            Zap: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
            Undo: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        };

        const initialTeams = [
            {
                id: "team_1",
                name: "Apex Thunder",
                color: "#10b981",
                players: [
                    { id: "p1", name: "Marcus Thompson", number: "23", gamesPlayed: 3, totalStats: { pts: 54, ast: 12, reb: 24, stl: 6, blk: 3, to: 4, pf: 6, fg2m: 18, fg3m: 5, fg2m_miss: 10, fg3m_miss: 6 } },
                    { id: "p2", name: "Darnell Carter", number: "3", gamesPlayed: 3, totalStats: { pts: 42, ast: 22, reb: 11, stl: 9, blk: 1, to: 8, pf: 4, fg2m: 12, fg3m: 6, fg2m_miss: 11, fg3m_miss: 12 } },
                    { id: "p3", name: "Jared Vance", number: "11", gamesPlayed: 3, totalStats: { pts: 28, ast: 8, reb: 32, stl: 2, blk: 8, to: 3, pf: 9, fg2m: 11, fg3m: 2, fg2m_miss: 9, fg3m_miss: 4 } }
                ]
            },
            {
                id: "team_2",
                name: "Shadow Elite",
                color: "#ef4444",
                players: [
                    { id: "p7", name: "Chris Evans", number: "10", gamesPlayed: 3, totalStats: { pts: 48, ast: 9, reb: 15, stl: 5, blk: 2, to: 3, pf: 5, fg2m: 15, fg3m: 6, fg2m_miss: 12, fg3m_miss: 9 } },
                    { id: "p8", name: "Devon Brooks", number: "1", gamesPlayed: 3, totalStats: { pts: 36, ast: 18, reb: 12, stl: 7, blk: 0, to: 6, pf: 4, fg2m: 9, fg3m: 6, fg2m_miss: 8, fg3m_miss: 14 } },
                    { id: "p9", name: "Malik Jenkins", number: "33", gamesPlayed: 3, totalStats: { pts: 30, ast: 4, reb: 35, stl: 11, blk: 11, to: 5, pf: 10, fg2m: 12, fg3m: 2, fg2m_miss: 15, fg3m_miss: 5 } }
                ]
            }
        ];

        const STAT_ACTIONS = [
            { id: 'pts_1', label: '+1 FT', category: 'score', stat: 'pts', val: 1, colorClass: 'bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-500' },
            { id: 'pts_2', label: '+2 PTS', category: 'score', stat: 'pts', val: 2, colorClass: 'bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-500', trackingStat: 'fg2m' },
            { id: 'pts_3', label: '+3 PTS', category: 'score', stat: 'pts', val: 3, colorClass: 'bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-500', trackingStat: 'fg3m' },
            
            { id: 'ast', label: '+1 AST', category: 'play', stat: 'ast', val: 1, colorClass: 'bg-emerald-700 hover:bg-emerald-600 text-white border-emerald-600' },
            { id: 'reb', label: '+1 REB', category: 'play', stat: 'reb', val: 1, colorClass: 'bg-emerald-700 hover:bg-emerald-600 text-white border-emerald-600' },
            { id: 'stl', label: '+1 STL', category: 'play', stat: 'stl', val: 1, colorClass: 'bg-emerald-700 hover:bg-emerald-600 text-white border-emerald-600' },
            { id: 'blk', label: '+1 BLK', category: 'play', stat: 'blk', val: 1, colorClass: 'bg-emerald-700 hover:bg-emerald-600 text-white border-emerald-600' },
            
            { id: 'fg2m_miss', label: '2PT Miss', category: 'miss', stat: 'fg2m_miss', val: 1, colorClass: 'bg-red-600 hover:bg-red-500 text-white border-red-500' },
            { id: 'fg3m_miss', label: '3PT Miss', category: 'miss', stat: 'fg3m_miss', val: 1, colorClass: 'bg-red-600 hover:bg-red-500 text-white border-red-500' },
            { id: 'to', label: '+1 TO', category: 'deficit', stat: 'to', val: 1, colorClass: 'bg-red-700 hover:bg-red-600 text-white border-red-650' },
            { id: 'pf', label: '+1 FOUL', category: 'deficit', stat: 'pf', val: 1, colorClass: 'bg-red-800 hover:bg-red-700 text-white border-red-700' }
        ];

        function App() {
            const [teams, setTeams] = useState([]);
            const [games, setGames] = useState([]);
            const [activeTab, setActiveTab] = useState('live');
            const [toast, setToast] = useState(null);

            const [isGameLive, setIsGameLive] = useState(false);
            const [teamAId, setTeamAId] = useState("");
            const [teamBId, setTeamBId] = useState("");
            const [teamAScore, setTeamAScore] = useState(0);
            const [teamBScore, setTeamBScore] = useState(0);
            
            const [teamALineup, setTeamALineup] = useState([]);
            const [teamABench, setTeamABench] = useState([]);
            const [teamBLineup, setTeamBLineup] = useState([]);
            const [teamBBench, setTeamBBench] = useState([]);
            
            const [liveStats, setLiveStats] = useState({});
            const [gameLog, setGameLog] = useState([]);
            
            const [loggedHistory, setLoggedHistory] = useState([]);
            const [activeAction, setActiveAction] = useState(null); 
            const [correctionMode, setCorrectionMode] = useState(false); 
            const [showLoggingModal, setShowLoggingModal] = useState(false);
            const [foulAlert, setFoulAlert] = useState(null);

            const [activeMobileConsoleTab, setActiveMobileConsoleTab] = useState('home');

            const [showNewTeamModal, setShowNewTeamModal] = useState(false);
            const [newTeamName, setNewTeamName] = useState("");
            const [newTeamColor, setNewTeamColor] = useState("#10b981");

            const [showNewPlayerModal, setShowNewPlayerModal] = useState(false);
            const [selectedTeamIdForPlayer, setSelectedTeamIdForPlayer] = useState("");
            const [newPlayerName, setNewPlayerName] = useState("");
            const [newPlayerNumber, setNewPlayerNumber] = useState("");

            const [showSubstitutionModal, setShowSubstitutionModal] = useState(false);
            const [subTargetPlayer, setSubTargetPlayer] = useState(null); 

            const [confirmDialog, setConfirmDialog] = useState(null);

            useEffect(() => {
                const isAnyModalOpen = showNewTeamModal || showNewPlayerModal || showSubstitutionModal || showLoggingModal || !!confirmDialog;
                if (isAnyModalOpen) {
                    document.body.style.overflow = 'hidden';
                    document.body.style.position = 'fixed';
                    document.body.style.width = '100%';
                } else {
                    document.body.style.overflow = '';
                    document.body.style.position = '';
                    document.body.style.width = '';
                }
                return () => {
                    document.body.style.overflow = '';
                    document.body.style.position = '';
                    document.body.style.width = '';
                };
            }, [showNewTeamModal, showNewPlayerModal, showSubstitutionModal, showLoggingModal, confirmDialog]);

            const handleExportData = () => {
                try {
                    const backupData = { teams, games };
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `league_stats_backup_${new Date().toISOString().split('T')[0]}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                    showToast("Database backup file downloaded!", "success");
                } catch (e) {
                    showToast("Failed to export database.", "error");
                }
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const fileReader = new FileReader();
                fileReader.readAsText(file, "UTF-8");
                fileReader.onload = (event) => {
                    try {
                        const parsedData = JSON.parse(event.target.result);
                        if (parsedData && Array.isArray(parsedData.teams)) {
                            saveTeamState(parsedData.teams);
                            if (Array.isArray(parsedData.games)) {
                                setGames(parsedData.games);
                                if (!window.firebaseDb) {
                                    localStorage.setItem('stat_games', JSON.stringify(parsedData.games));
                               }
                            }
                            showToast("Database backup successfully restored!", "success");
                        }
                    } catch (err) {
                        showToast("Failed to parse system backup file.", "error");
                    }
                };
            };

            const handleExportRostersOnly = () => {
                try {
                    const rostersOnly = teams.map(t => ({
                        id: t.id,
                        name: t.name,
                        color: t.color,
                        players: t.players.map(p => ({
                            id: p.id,
                            name: p.name,
                            number: p.number,
                            gamesPlayed: 0,
                            totalStats: { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 }
                        }))
                    }));
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(rostersOnly));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `league_rosters_${new Date().toISOString().split('T')[0]}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                    showToast("Roster templates exported!", "success");
                } catch (e) {
                    showToast("Failed to compile roster export.", "error");
                }
            };

            const handleImportRostersOnly = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const fileReader = new FileReader();
                fileReader.readAsText(file, "UTF-8");
                fileReader.onload = (event) => {
                    try {
                        const parsedRosters = JSON.parse(event.target.result);
                        if (parsedRosters && Array.isArray(parsedRosters)) {
                            saveTeamState(parsedRosters);
                            showToast("Team rosters imported!", "success");
                        }
                    } catch (err) {
                        showToast("Failed to process roster upload.", "error");
                    }
                };
            };

            const handleMergeData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const fileReader = new FileReader();
                fileReader.readAsText(file, "UTF-8");
                fileReader.onload = (event) => {
                    try {
                        const parsedData = JSON.parse(event.target.result);
                        if (!parsedData || !Array.isArray(parsedData.teams) || !Array.isArray(parsedData.games)) return;

                        const newGames = parsedData.games.filter(ig => !games.some(lg => lg.id === ig.id));
                        if (newGames.length === 0) {
                            showToast("No new game records found to merge.", "info");
                            return;
                        }

                        let mergedTeams = JSON.parse(JSON.stringify(teams));

                        parsedData.teams.forEach(importedTeam => {
                            if (!mergedTeams.some(localTeam => localTeam.id === importedTeam.id)) {
                                mergedTeams.push(importedTeam);
                            }
                        });

                        parsedData.teams.forEach(importedTeam => {
                            const localTeam = mergedTeams.find(t => t.id === importedTeam.id);
                            if (localTeam) {
                                importedTeam.players.forEach(importedPlayer => {
                                    if (!localTeam.players.some(p => p.id === importedPlayer.id)) {
                                        const newPlayerObj = {
                                            ...importedPlayer,
                                            gamesPlayed: 0,
                                            totalStats: { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 }
                                        };
                                        localTeam.players.push(newPlayerObj);
                                    }
                                });
                            }
                        });

                        newGames.forEach(game => {
                            Object.entries(game.playerStats).forEach(([playerId, stats]) => {
                                let foundPlayer = null;
                                for (let t of mergedTeams) {
                                    foundPlayer = t.players.find(p => p.id === playerId);
                                    if (foundPlayer) break;
                                }

                                if (foundPlayer) {
                                    foundPlayer.gamesPlayed += 1;
                                    foundPlayer.totalStats.pts += (stats.pts || 0);
                                    foundPlayer.totalStats.ast += (stats.ast || 0);
                                    foundPlayer.totalStats.reb += (stats.reb || 0);
                                    foundPlayer.totalStats.stl += (stats.stl || 0);
                                    foundPlayer.totalStats.blk += (stats.blk || 0);
                                    foundPlayer.totalStats.to += (stats.to || 0);
                                    foundPlayer.totalStats.pf += (stats.pf || 0);
                                    foundPlayer.totalStats.fg2m = (foundPlayer.totalStats.fg2m || 0) + (stats.fg2m || 0);
                                    foundPlayer.totalStats.fg3m = (foundPlayer.totalStats.fg3m || 0) + (stats.fg3m || 0);
                                    foundPlayer.totalStats.fg2m_miss = (foundPlayer.totalStats.fg2m_miss || 0) + (stats.fg2m_miss || 0);
                                    foundPlayer.totalStats.fg3m_miss = (foundPlayer.totalStats.fg3m_miss || 0) + (stats.fg3m_miss || 0);
                                }
                            });
                        });

                        const mergedGames = [...newGames, ...games].sort((a, b) => b.id.localeCompare(a.id));
                        saveTeamState(mergedTeams);
                        setGames(mergedGames);
                        if (!window.firebaseDb) {
                            localStorage.setItem('stat_games', JSON.stringify(mergedGames));
                        }
                        showToast(`Merged ${newGames.length} new game(s)!`, "success");
                    } catch (err) {
                        showToast("Failed to complete data merge.", "error");
                    }
                };
            };

            useEffect(() => {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'wknd-league-stats';

                if (window.firebaseDb) {
                    const { collection, onSnapshot, signInAnonymously, signInWithCustomToken } = window.firebaseUtils;
                    const auth = window.firebaseAuth;

                    const initializeSync = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await signInAnonymously(auth);
                            }
                        } catch (e) {}

                        const teamsPath = collection(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'teams');
                        const unsubTeams = onSnapshot(teamsPath, (snapshot) => {
                            const cloudTeams = [];
                            snapshot.forEach(doc => { cloudTeams.push({ id: doc.id, ...doc.data() }); });
                            if (cloudTeams.length > 0) setTeams(cloudTeams);
                            else setTeams(initialTeams);
                        });

                        const gamesPath = collection(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'games');
                        const unsubGames = onSnapshot(gamesPath, (snapshot) => {
                            const cloudGames = [];
                            snapshot.forEach(doc => { cloudGames.push({ id: doc.id, ...doc.data() }); });
                            setGames(cloudGames.sort((a, b) => b.id.localeCompare(a.id)));
                        });

                        return () => { unsubTeams(); unsubGames(); };
                    };
                    initializeSync();
                } else {
                    const savedTeams = localStorage.getItem('stat_teams');
                    const savedGames = localStorage.getItem('stat_games');
                    setTeams(savedTeams ? JSON.parse(savedTeams) : initialTeams);
                    setGames(savedGames ? JSON.parse(savedGames) : []);
                }

                try {
                    const activeSession = localStorage.getItem('active_live_session');
                    if (activeSession) {
                        const session = JSON.parse(activeSession);
                        setTeamAId(session.teamAId || "");
                        setTeamBId(session.teamBId || "");
                        setTeamAScore(session.teamAScore || 0);
                        setTeamBScore(session.teamBScore || 0);
                        setTeamALineup(session.teamALineup || []);
                        setTeamABench(session.teamABench || []);
                        setTeamBLineup(session.teamBLineup || []);
                        setTeamBBench(session.teamBBench || []);
                        setLiveStats(session.liveStats || {});
                        setGameLog(session.gameLog || []);
                        setLoggedHistory(session.loggedHistory || []);
                        setIsGameLive(true);
                    }
                } catch (e) {}
            }, []);

            useEffect(() => {
                if (!window.firebaseDb && teams.length > 0) {
                    localStorage.setItem('stat_teams', JSON.stringify(teams));
                }
            }, [teams]);

            useEffect(() => {
                if (!window.firebaseDb && games.length > 0) {
                    localStorage.setItem('stat_games', JSON.stringify(games));
                }
            }, [games]);

            useEffect(() => {
                if (isGameLive) {
                    const session = { teamAId, teamBId, teamAScore, teamBScore, teamALineup, teamABench, teamBLineup, teamBBench, liveStats, gameLog, loggedHistory };
                    localStorage.setItem('active_live_session', JSON.stringify(session));
                } else {
                    localStorage.removeItem('active_live_session');
                }
            }, [isGameLive, teamAId, teamBId, teamAScore, teamBScore, teamALineup, teamABench, teamBLineup, teamBBench, liveStats, gameLog, loggedHistory]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const getWallClockTime = () => {
                return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            };

            const saveTeamState = async (updatedTeams) => {
                setTeams(updatedTeams);
                if (window.firebaseDb) {
                    const { doc, setDoc } = window.firebaseUtils;
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'wknd-league-stats';
                    for (const team of updatedTeams) {
                        await setDoc(doc(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'teams', team.id), team);
                    }
                }
            };

            const saveNewGameState = async (newGame, updatedTeams) => {
                setGames(prev => [newGame, ...prev]);
                setTeams(updatedTeams);
                if (window.firebaseDb) {
                    const { doc, setDoc } = window.firebaseUtils;
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'wknd-league-stats';
                    await setDoc(doc(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'games', newGame.id), newGame);
                    for (const team of updatedTeams) {
                        await setDoc(doc(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'teams', team.id), team);
                    }
                }
            };

            const handleStartMatch = (e) => {
                e.preventDefault();
                if (!teamAId || !teamBId || teamAId === teamBId) return;

                const teamAObj = teams.find(t => t.id === teamAId);
                const teamBObj = teams.find(t => t.id === teamBId);
                if (!teamAObj || !teamBObj || teamAObj.players.length === 0 || teamBObj.players.length === 0) return;

                const startersA = teamAObj.players.slice(0, 5).map(p => p.id);
                const benchA = teamAObj.players.slice(5).map(p => p.id);
                const startersB = teamBObj.players.slice(0, 5).map(p => p.id);
                const benchB = teamBObj.players.slice(5).map(p => p.id);

                setTeamALineup(startersA);
                setTeamABench(benchA);
                setTeamBLineup(startersB);
                setTeamBBench(benchB);

                const initializedStats = {};
                teamAObj.players.forEach(p => { initializedStats[p.id] = { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 }; });
                teamBObj.players.forEach(p => { initializedStats[p.id] = { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 }; });

                setLiveStats(initializedStats);
                setTeamAScore(0);
                setTeamBScore(0);
                setActiveAction(null);
                setCorrectionMode(false);
                setLoggedHistory([]);
                setGameLog([{ time: getWallClockTime(), text: `Match initialized: ${teamAObj.name} vs ${teamBObj.name}` }]);
                setIsGameLive(true);
            };

            const handlePlayerClick = (playerId, isTeamA) => {
                if (!activeAction) return;

                const multiplier = correctionMode ? -1 : 1;
                const changeAmount = activeAction.val * multiplier;
                const statField = activeAction.stat;
                const attachedTrackingStat = activeAction.trackingStat;

                const playerObj = teams.flatMap(t => t.players).find(p => p.id === playerId);
                let logText = "";
                if (playerObj) {
                    if (correctionMode) {
                        logText = `🔄 CORRECTION: ${playerObj.name} stat adjusted`;
                    } else {
                        logText = `⚡ ${playerObj.name}: ${activeAction.label}`;
                    }
                }

                const logWithTag = `[${isTeamA ? 'HOME' : 'AWAY'}] ${logText}`;

                setLoggedHistory(prev => [{ playerId, statField, changeAmount, attachedTrackingStat, previousTeamAScore: teamAScore, previousTeamBScore: teamBScore, logText: logWithTag }, ...prev]);

                setLiveStats(prev => {
                    const currentVal = prev[playerId]?.[statField] || 0;
                    const newVal = Math.max(0, currentVal + changeAmount);
                    let playerUpdate = { ...prev[playerId], [statField]: newVal };

                    if (attachedTrackingStat) {
                        const currentTrackVal = prev[playerId]?.[attachedTrackingStat] || 0;
                        playerUpdate[attachedTrackingStat] = Math.max(0, currentTrackVal + (1 * multiplier));
                    }

                    if (statField === 'pf' && multiplier > 0) {
                        if (newVal === 4) {
                            setFoulAlert({ playerName: playerObj?.name, playerNumber: playerObj?.number, type: 'warning', count: 4 });
                        } else if (newVal >= 5) {
                            setFoulAlert({ playerName: playerObj?.name, playerNumber: playerObj?.number, type: 'fouled_out', count: 5 });
                        }
                    }

                    const updated = { ...prev, [playerId]: playerUpdate };
                    let totalA = 0, totalB = 0;
                    const teamAObj = teams.find(t => t.id === teamAId);
                    const teamBObj = teams.find(t => t.id === teamBId);

                    if (teamAObj) teamAObj.players.forEach(p => { totalA += updated[p.id]?.pts || 0; });
                    if (teamBObj) teamBObj.players.forEach(p => { totalB += updated[p.id]?.pts || 0; });

                    setTeamAScore(totalA);
                    setTeamBScore(totalB);
                    return updated;
                });

                setGameLog(prev => [{ time: getWallClockTime(), text: logWithTag }, ...prev.slice(0, 50)]);
                setActiveAction(null);
                setCorrectionMode(false);
                setShowLoggingModal(false);
            };

            const handleUndo = () => {
                if (loggedHistory.length === 0) return;
                const [lastAction, ...remainingHistory] = loggedHistory;
                setLoggedHistory(remainingHistory);

                setLiveStats(prev => {
                    const currentPlayerStats = prev[lastAction.playerId];
                    if (!currentPlayerStats) return prev;
                    let restoredPlayerStats = { ...currentPlayerStats, [lastAction.statField]: Math.max(0, (currentPlayerStats[lastAction.statField] || 0) - lastAction.changeAmount) };
                    if (lastAction.attachedTrackingStat) {
                        const trackingDecrement = lastAction.changeAmount > 0 ? 1 : -1;
                        restoredPlayerStats[lastAction.attachedTrackingStat] = Math.max(0, (currentPlayerStats[lastAction.attachedTrackingStat] || 0) - trackingDecrement);
                    }
                    return { ...prev, [lastAction.playerId]: restoredPlayerStats };
                });

                setTeamAScore(lastAction.previousTeamAScore);
                setTeamBScore(lastAction.previousTeamBScore);
                setGameLog(prev => prev.filter(log => log.text !== lastAction.logText));
            };

            const triggerSubModal = (playerId, isTeamA) => {
                const playerObj = teams.flatMap(t => t.players).find(p => p.id === playerId);
                if (!playerObj) return;
                setSubTargetPlayer({ id: playerId, name: playerObj.name, number: playerObj.number, team: isTeamA ? 'A' : 'B' });
                setShowSubstitutionModal(true);
            };

            const executeSubstitution = (outId, inId, isTeamA) => {
                if (isTeamA) {
                    setTeamALineup(prev => prev.map(id => id === outId ? inId : id));
                    setTeamABench(prev => prev.map(id => id === inId ? outId : id));
                } else {
                    setTeamBLineup(prev => prev.map(id => id === outId ? inId : id));
                    setTeamBBench(prev => prev.map(id => id === inId ? outId : id));
                }
                setShowSubstitutionModal(false);
                setSubTargetPlayer(null);
            };

            const handleEndGame = () => {
                const teamAObj = teams.find(t => t.id === teamAId);
                const teamBObj = teams.find(t => t.id === teamBId);
                if (!teamAObj || !teamBObj) return;

                const newGameEntry = { id: `game_${Date.now()}`, teamAId, teamBId, teamAName: teamAObj.name, teamBName: teamBObj.name, teamAScore, teamBScore, date: new Date().toISOString().split('T')[0], playerStats: liveStats };
                const updatedTeams = teams.map(t => {
                    if (t.id !== teamAId && t.id !== teamBId) return t;
                    const updatedPlayers = t.players.map(p => {
                        const statObj = liveStats[p.id];
                        if (!statObj) return p;
                        return {
                            ...p,
                            gamesPlayed: p.gamesPlayed + 1,
                            totalStats: {
                                pts: (p.totalStats.pts || 0) + (statObj.pts || 0),
                                ast: (p.totalStats.ast || 0) + (statObj.ast || 0),
                                reb: (p.totalStats.reb || 0) + (statObj.reb || 0),
                                stl: (p.totalStats.stl || 0) + (statObj.stl || 0),
                                blk: (p.totalStats.blk || 0) + (statObj.blk || 0),
                                to: (p.totalStats.to || 0) + (statObj.to || 0),
                                pf: (p.totalStats.pf || 0) + (statObj.pf || 0),
                                fg2m: (p.totalStats.fg2m || 0) + (statObj.fg2m || 0),
                                fg3m: (p.totalStats.fg3m || 0) + (statObj.fg3m || 0),
                                fg2m_miss: (p.totalStats.fg2m_miss || 0) + (statObj.fg2m_miss || 0),
                                fg3m_miss: (p.totalStats.fg3m_miss || 0) + (statObj.fg3m_miss || 0)
                            }
                        };
                    });
                    return { ...t, players: updatedPlayers };
                });

                saveNewGameState(newGameEntry, updatedTeams);
                setIsGameLive(false);
                setActiveAction(null);
                localStorage.removeItem('active_live_session');
                setActiveTab('history');
            };

            const handleCreateTeam = (e) => {
                e.preventDefault();
                if (!newTeamName.trim()) return;
                const newTeam = { id: `team_${Date.now()}`, name: newTeamName.trim(), color: newTeamColor, players: [] };
                saveTeamState([...teams, newTeam]);
                setNewTeamName("");
                setShowNewTeamModal(false);
            };

            const handleCreatePlayer = (e) => {
                e.preventDefault();
                if (!newPlayerName.trim() || !newPlayerNumber.trim() || !selectedTeamIdForPlayer) return;
                const newPlayer = { id: `player_${Date.now()}`, name: newPlayerName.trim(), number: newPlayerNumber.trim(), gamesPlayed: 0, totalStats: { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 } };
                const updatedTeams = teams.map(t => t.id === selectedTeamIdForPlayer ? { ...t, players: [...t.players, newPlayer] } : t);
                saveTeamState(updatedTeams);
                setNewPlayerName("");
                setNewPlayerNumber("");
                setShowNewPlayerModal(false);
            };

            const handleDeletePlayer = (teamId, playerId) => {
                setConfirmDialog({
                    title: "Delete Athlete?",
                    text: "Permanently wipe this player profile.",
                    onConfirm: () => {
                        const updatedTeams = teams.map(t => t.id === teamId ? { ...t, players: t.players.filter(p => p.id !== playerId) } : t);
                        saveTeamState(updatedTeams);
                        setConfirmDialog(null);
                    }
                });
            };

            const handleDeleteTeam = (teamId) => {
                setConfirmDialog({
                    title: "Erase Franchise?",
                    text: "Permanently delete this team from records.",
                    onConfirm: () => {
                        const remaining = teams.filter(t => t.id !== teamId);
                        setTeams(remaining);
                        if (window.firebaseDb) {
                            const { doc, deleteDoc } = window.firebaseUtils;
                            const appId = typeof __app_id !== 'undefined' ? __app_id : 'wknd-league-stats';
                            deleteDoc(doc(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'teams', teamId));
                        }
                        setConfirmDialog(null);
                    }
                });
            };

            const computeShootingPercentages = (stats) => {
                const totalMade = (stats.fg2m || 0) + (stats.fg3m || 0);
                const totalAttempts = totalMade + (stats.fg2m_miss || 0) + (stats.fg3m_miss || 0);
                const total3PtAttempts = (stats.fg3m || 0) + (stats.fg3m_miss || 0);
                return {
                    fgPct: totalAttempts === 0 ? "0%" : `${Math.round((totalMade / totalAttempts) * 100)}%`,
                    fg3Pct: total3PtAttempts === 0 ? "0%" : `${Math.round(((stats.fg3m || 0) / total3PtAttempts) * 100)}%`
                };
            };

            const getAverages = (player) => {
                const gp = player.gamesPlayed || 0;
                const stats = player.totalStats || {};
                if (gp === 0) return { pts: '0.0', ast: '0.0', reb: '0.0', stl: '0.0', blk: '0.0', to: '0.0', pf: '0.0', fgPct: '0%', fg3Pct: '0%', spg: '0.0', bpg: '0.0' };
                const pctSummary = computeShootingPercentages(stats);
                return {
                    pts: ((stats.pts || 0) / gp).toFixed(1),
                    ast: ((stats.ast || 0) / gp).toFixed(1),
                    reb: ((stats.reb || 0) / gp).toFixed(1),
                    stl: ((stats.stl || 0) / gp).toFixed(1),
                    blk: ((stats.blk || 0) / gp).toFixed(1),
                    to: ((stats.to || 0) / gp).toFixed(1),
                    pf: ((stats.pf || 0) / gp).toFixed(1),
                    fgPct: pctSummary.fgPct,
                    fg3Pct: pctSummary.fg3Pct,
                    spg: ((stats.stl || 0) / gp).toFixed(1),
                    bpg: ((stats.blk || 0) / gp).toFixed(1)
                };
            };

            const renderPlayerCompactRow = (playerId, isTeamA) => {
                const teamObj = isTeamA ? teams.find(t => t.id === teamAId) : teams.find(t => t.id === teamBId);
                const player = teamObj?.players.find(p => p.id === playerId);
                if (!player) return null;
                const stats = liveStats[playerId] || { pts: 0, ast: 0, reb: 0, stl: 0, blk: 0, to: 0, pf: 0, fg2m: 0, fg3m: 0, fg2m_miss: 0, fg3m_miss: 0 };
                const currentPct = computeShootingPercentages(liveStats[playerId] || {});

                const hasActionArmed = activeAction !== null;
                const isFoulTrouble = stats.pf === 4;
                const isFouledOut = stats.pf >= 5;

                return (
                    <div 
                        key={player.id} 
                        onClick={() => hasActionArmed && handlePlayerClick(player.id, isTeamA)}
                        className={`bg-slate-950/90 border p-3.5 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3 transition-all select-none ${
                            isFouledOut ? 'opacity-50 border-red-900 bg-red-950/10' : 'border-slate-800 hover:border-slate-700/60'
                        } ${
                            hasActionArmed && !isFouledOut
                            ? 'armed-target hover:bg-slate-900 border-emerald-500/50' 
                            : ''
                        }`}
                    >
                        <div className="flex items-center gap-3 flex-shrink-0">
                            <span className="font-mono text-xs font-bold text-slate-300 bg-slate-900 px-2.5 py-1 rounded-xl border border-slate-800">#{player.number}</span>
                            <div className="min-w-0">
                                <div className="flex items-center gap-2">
                                    <span className="font-extrabold text-sm text-white block truncate">{player.name}</span>
                                    {isFoulTrouble && (
                                        <span className="bg-amber-500/20 text-amber-400 text-[9px] px-1.5 py-0.5 rounded border border-amber-500/30 font-bold animate-pulse flex-shrink-0">
                                            ⚠️ 4 PF
                                        </span>
                                    )}
                                    {isFouledOut && (
                                        <span className="bg-red-500/20 text-red-400 text-[9px] px-1.5 py-0.5 rounded border border-red-500/30 font-bold flex-shrink-0 animate-bounce">
                                            🚨 OUT (5 PF)
                                        </span>
                                    )}
                                </div>
                                <button onClick={(e) => { e.stopPropagation(); triggerSubModal(player.id, isTeamA); }} className="text-[10px] text-orange-400 hover:text-orange-300 font-bold flex items-center gap-1 mt-0.5 cursor-pointer">
                                    <Icons.ArrowRightLeft /> Substitute
                                </button>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-1.5 text-[11px] font-mono font-bold bg-slate-900/60 px-3 py-2 rounded-xl border border-slate-850/80">
                            <span className="text-orange-400">PTS: <span className="text-white text-xs">{stats.pts}</span></span>
                            <span className="text-slate-600">•</span>
                            <span className="text-emerald-400">FG%: <span className="text-white">{currentPct.fgPct}</span></span>
                            <span className="text-slate-600">•</span>
                            <span className="text-cyan-400">3P%: <span className="text-white">{currentPct.fg3Pct}</span></span>
                            <span className="text-slate-600">•</span>
                            <span className="text-emerald-400">REB: <span className="text-white">{stats.reb}</span></span>
                            <span className="text-slate-600">•</span>
                            <span className="text-blue-400">AST: <span className="text-white">{stats.ast}</span></span>
                            <span className="text-slate-600">•</span>
                            <span className="text-amber-500">TO: <span className="text-white">{stats.to}</span></span>
                            <span className="text-slate-600">•</span>
                            <span className={`px-1.5 py-0.5 rounded ${stats.pf >= 4 ? 'bg-red-950 text-red-400 border border-red-900' : 'text-slate-400'}`}>
                                PF: {stats.pf}/5
                            </span>
                        </div>
                    </div>
                );
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-4 md:py-8">
                    
                    {/* LEAGUE HEADER */}
                    <header className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-4 border-b border-slate-800 pb-4">
                        <div>
                            <h1 className="text-xl md:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-orange-400 to-amber-300 bg-clip-text text-transparent">WKND League Stats</h1>
                        </div>

                        {/* NAV CONTROL TABS */}
                        <nav className="flex bg-slate-900 p-1 rounded-xl border border-slate-800 gap-0.5">
                            <button onClick={() => setActiveTab('live')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ${activeTab === 'live' ? 'bg-orange-500 text-white shadow-lg' : 'text-slate-400'}`}><Icons.Activity /> Console</button>
                            <button onClick={() => setActiveTab('teams')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ${activeTab === 'teams' ? 'bg-orange-500 text-white shadow-lg' : 'text-slate-400'}`}><Icons.Users /> Teams</button>
                            <button onClick={() => setActiveTab('history')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ${activeTab === 'history' ? 'bg-orange-500 text-white shadow-lg' : 'text-slate-400'}`}><Icons.History /> History</button>
                            <button onClick={() => setActiveTab('leaders')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ${activeTab === 'leaders' ? 'bg-orange-500 text-white shadow-lg' : 'text-slate-400'}`}><Icons.Trophy /> Leaders</button>
                        </nav>
                    </header>

                    {/* MAIN DECK */}
                    <main>
                        {activeTab === 'live' && (
                            <div>
                                {!isGameLive ? (
                                    <div className="max-w-xl mx-auto bg-slate-900/65 rounded-2xl border border-slate-800 p-6 shadow-2xl mt-4">
                                        <form onSubmit={handleStartMatch} className="space-y-4">
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-slate-400 text-xs font-bold mb-1 uppercase">Home (A)</label>
                                                    <select value={teamAId} onChange={(e) => setTeamAId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-xs focus:outline-none" required>
                                                        <option value="">-- Select --</option>
                                                        {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-slate-400 text-xs font-bold mb-1 uppercase">Away (B)</label>
                                                    <select value={teamBId} onChange={(e) => setTeamBId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-xs focus:outline-none" required>
                                                        <option value="">-- Select --</option>
                                                        {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <button type="submit" className="w-full bg-orange-500 font-bold py-2.5 rounded-xl text-xs text-white cursor-pointer shadow-lg">Start Live Tracking Match</button>
                                        </form>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                                        {/* COMPACT MOBILE SCOREBAR */}
                                        <div className="col-span-12 bg-slate-900 border border-slate-800 p-2 rounded-xl shadow-xl">
                                            <div className="grid grid-cols-7 items-center bg-slate-950 border border-slate-900 px-3 py-1.5 rounded-lg">
                                                <div className="col-span-3 text-center">
                                                    <span className="text-[10px] text-slate-400 font-bold block truncate">{teams.find(t => t.id === teamAId)?.name}</span>
                                                    <div className="text-xl font-mono font-black text-white">{teamAScore}</div>
                                                </div>
                                                <div className="col-span-1 text-center text-slate-600 font-black font-mono text-xs">VS</div>
                                                <div className="col-span-3 text-center">
                                                    <span className="text-[10px] text-slate-400 font-bold block truncate">{teams.find(t => t.id === teamBId)?.name}</span>
                                                    <div className="text-xl font-mono font-black text-white">{teamBScore}</div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* QUICK ACTION DECK GRID WITH RESPONSIVE DISPLAY */}
                                        <div className="col-span-12 bg-slate-900 border border-slate-800 p-3 rounded-xl shadow-xl space-y-2">
                                            <div className="flex justify-between items-center border-b border-slate-800 pb-1.5">
                                                <span className="text-[10px] text-emerald-400 uppercase tracking-wider font-extrabold flex items-center gap-1"><Icons.Zap /> Tap an action to apply directly to courtside rosters</span>
                                                <div className="flex gap-2">
                                                    <button onClick={handleUndo} disabled={loggedHistory.length === 0} className="px-2 py-0.5 rounded bg-amber-500/10 border border-amber-500/30 text-amber-400 text-[10px] font-bold">Undo</button>
                                                    <button onClick={() => setCorrectionMode(!correctionMode)} className={`px-2 py-0.5 rounded text-[10px] font-bold border ${correctionMode ? 'bg-red-950 text-red-400 border-red-700' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>Correction</button>
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-2">
                                                {STAT_ACTIONS.map(act => (
                                                    <button key={act.id} onClick={() => { setActiveAction(act); setShowLoggingModal(true); }} className={`p-2 rounded-lg text-center text-[10px] font-black border transition-all active:scale-95 cursor-pointer ${act.colorClass} border-transparent`}>
                                                        {act.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Mobile Tab Toggles */}
                                        <div className="col-span-12 md:hidden flex bg-slate-950 p-1 rounded-xl border border-slate-850 gap-1">
                                            <button onClick={() => setActiveMobileConsoleTab('home')} className={`flex-1 py-1.5 text-center text-xs font-bold rounded-lg ${activeMobileConsoleTab === 'home' ? 'bg-slate-800 text-white' : 'text-slate-400'}`}>🏠 Home lineup</button>

                                    {/* Panel 6: Turnovers (TOPG) */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col max-h-[350px]">
                                        <h4 className="font-extrabold text-[11px] uppercase text-red-400 border-b border-slate-800 pb-2 mb-2 flex justify-between"><span>Turnovers (TOPG)</span> <span>TO</span></h4>
                                        <div className="space-y-2 overflow-y-auto flex-1 pr-1 text-xs font-medium">
                                            {teams.flatMap(t => t.players.map(p => ({ ...p, avg: getAverages(p) }))).sort((a,b) => parseFloat(b.avg.to) - parseFloat(a.avg.to)).map((p, i) => (
                                                <div key={p.id} className="flex justify-between border-b border-slate-850/40 py-1.5 last:border-0"><span className="truncate text-slate-300"><strong className="font-mono text-slate-500 mr-1">#{i+1}</strong>{p.name}</span><span className="font-mono font-bold text-red-400 bg-red-500/5 px-1.5 rounded">{p.avg.to}</span></div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Panel 7: Efficiency (FG%) */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col max-h-[350px]">
                                        <h4 className="font-extrabold text-[11px] uppercase text-cyan-400 border-b border-slate-800 pb-2 mb-2 flex justify-between"><span>Efficiency (FG%)</span> <span>FG%</span></h4>
                                        <div className="space-y-2 overflow-y-auto flex-1 pr-1 text-xs font-medium">
                                            {teams.flatMap(t => t.players.map(p => ({ ...p, avg: getAverages(p) }))).sort((a,b) => parseFloat(b.avg.fgPct) - parseFloat(a.avg.fgPct)).map((p, i) => (
                                                <div key={p.id} className="flex justify-between border-b border-slate-850/40 py-1.5 last:border-0"><span className="truncate text-slate-300"><strong className="font-mono text-slate-500 mr-1">#{i+1}</strong>{p.name}</span><span className="font-mono font-bold text-cyan-400 bg-cyan-500/5 px-1.5 rounded">{p.avg.fgPct}</span></div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Panel 8: Perimeter (3P%) */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col max-h-[350px]">
                                        <h4 className="font-extrabold text-[11px] uppercase text-sky-400 border-b border-slate-800 pb-2 mb-2 flex justify-between"><span>Perimeter (3P%)</span> <span>3P%</span></h4>
                                        <div className="space-y-2 overflow-y-auto flex-1 pr-1 text-xs font-medium">
                                            {teams.flatMap(t => t.players.map(p => ({ ...p, avg: getAverages(p) }))).sort((a,b) => parseFloat(b.avg.fg3Pct) - parseFloat(a.avg.fg3Pct)).map((p, i) => (
                                                <div key={p.id} className="flex justify-between border-b border-slate-850/40 py-1.5 last:border-0"><span className="truncate text-slate-300"><strong className="font-mono text-slate-500 mr-1">#{i+1}</strong>{p.name}</span><span className="font-mono font-bold text-sky-400 bg-sky-500/5 px-1.5 rounded">{p.avg.fg3Pct}</span></div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Panel 9: Fouls (PF/G) */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col max-h-[350px]">
                                        <h4 className="font-extrabold text-[11px] uppercase text-rose-400 border-b border-slate-800 pb-2 mb-2 flex justify-between"><span>Fouls (PF/G)</span> <span>PF</span></h4>
                                        <div className="space-y-2 overflow-y-auto flex-1 pr-1 text-xs font-medium">
                                            {teams.flatMap(t => t.players.map(p => ({ ...p, avg: getAverages(p) }))).sort((a,b) => parseFloat(b.avg.pf) - parseFloat(a.avg.pf)).map((p, i) => (
                                                <div key={p.id} className="flex justify-between border-b border-slate-850/40 py-1.5 last:border-0"><span className="truncate text-slate-300"><strong className="font-mono text-slate-500 mr-1">#{i+1}</strong>{p.name}</span><span className="font-mono font-bold text-rose-400 bg-rose-500/5 px-1.5 rounded">{p.avg.pf}</span></div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* FOOTER BAR */}
                    <footer className="mt-16 pt-5 border-t border-slate-850 text-center text-[11px] text-slate-500">
                        <p>© 2026 League Statistician Console. Securely saving records in real-time Cloud Sync.</p>
                    </footer>

                    {/* MODAL WRAPPERS */}
                    {showNewTeamModal && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-sm relative">
                                <h3 className="text-sm font-bold text-white mb-3">Create League Franchise</h3>
                                <form onSubmit={handleCreateTeam} className="space-y-3 text-xs">
                                    <input type="text" value={newTeamName} onChange={(e) => setNewTeamName(e.target.value)} placeholder="Team Name" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white" required />
                                    <input type="color" value={newTeamColor} onChange={(e) => setNewTeamColor(e.target.value)} className="w-8 h-8 bg-transparent border-0 cursor-pointer block" />
                                    <div className="flex gap-2 font-bold pt-1">
                                        <button type="button" onClick={() => setShowNewTeamModal(false)} className="flex-1 py-2 bg-slate-950 text-slate-400 rounded-xl border border-slate-855">Cancel</button>
                                        <button type="submit" className="flex-1 py-2 bg-emerald-600 text-white rounded-xl">Create</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showNewPlayerModal && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-sm relative">
                                <h3 className="text-sm font-bold text-white mb-3">Register Roster Entry</h3>
                                <form onSubmit={handleCreatePlayer} className="space-y-3 text-xs">
                                    <select value={selectedTeamIdForPlayer} onChange={(e) => setSelectedTeamIdForPlayer(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white">
                                        {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                    </select>
                                    <input type="text" value={newPlayerName} onChange={(e) => setNewPlayerName(e.target.value)} placeholder="Full Name" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white" required />
                                    <input type="text" value={newPlayerNumber} onChange={(e) => setNewPlayerNumber(e.target.value)} placeholder="Jersey No." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white font-mono" required />
                                    <div className="flex gap-2 font-bold pt-1">
                                        <button type="button" onClick={() => setShowNewPlayerModal(false)} className="flex-1 py-2 bg-slate-950 text-slate-400 rounded-xl border border-slate-850">Cancel</button>
                                        <button type="submit" className="flex-1 py-2 bg-emerald-600 text-white rounded-xl">Register</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showSubstitutionModal && subTargetPlayer && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-sm relative">
                                <h3 className="text-sm font-bold text-white mb-3 flex items-center gap-1"><Icons.ArrowRightLeft /> Substitute Athlete</h3>
                                <div className="space-y-2 max-h-[220px] overflow-y-auto">
                                    {(() => {
                                        const benchIds = subTargetPlayer.team === 'A' ? teamABench : teamBBench;
                                        const teamObj = subTargetPlayer.team === 'A' ? teams.find(t => t.id === teamAId) : teams.find(t => t.id === teamBId);
                                        return benchIds.map(benchId => {
                                            const p = teamObj?.players.find(x => x.id === benchId);
                                            return p ? (
                                                <button key={benchId} onClick={() => executeSubstitution(subTargetPlayer.id, benchId, subTargetPlayer.team === 'A')} className="w-full text-xs flex justify-between p-2.5 bg-slate-950 border border-slate-850 rounded-lg text-slate-200">
                                                    <span>#{p.number} {p.name}</span> <span className="text-emerald-400 font-bold">Sub In</span>
                                                </button>
                                            ) : null;
                                        });
                                    })()}
                                </div>
                                <button onClick={() => setShowSubstitutionModal(false)} className="w-full mt-3 py-2 bg-slate-950 text-slate-400 border border-slate-855 text-xs rounded-xl">Cancel</button>
                            </div>
                        </div>
                    )}

                    {showLoggingModal && activeAction && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-2xl shadow-2xl relative">
                                <div className="text-center mb-3">
                                    <h3 className="text-sm font-black text-white">Record Action: <span className="text-emerald-400 font-mono">{activeAction.label}</span></h3>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-850">
                                        <div className="font-extrabold text-[10px] text-slate-400 mb-2 uppercase">Home On Court</div>
                                        <div className="space-y-1.5">
                                            {teamALineup.map(id => {
                                                const p = teams.find(t => t.id === teamAId)?.players.find(x => x.id === id);
                                                return p ? <button key={id} onClick={() => handlePlayerClick(id, true)} className="w-full p-2.5 bg-slate-900 border border-slate-800 text-left text-xs text-white font-bold rounded-xl hover:border-emerald-500 transition-colors">#{p.number} {p.name}</button> : null;
                                            })}
                                        </div>
                                    </div>
                                    <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-850">
                                        <div className="font-extrabold text-[10px] text-slate-400 mb-2 uppercase">Away On Court</div>
                                        <div className="space-y-1.5">
                                            {teamBLineup.map(id => {
                                                const p = teams.find(t => t.id === teamBId)?.players.find(x => x.id === id);
                                                return p ? <button key={id} onClick={() => handlePlayerClick(id, false)} className="w-full p-2.5 bg-slate-900 border border-slate-800 text-left text-xs text-white font-bold rounded-xl hover:border-emerald-500 transition-colors">#{p.number} {p.name}</button> : null;
                                            })}
                                        </div>
                                    </div>
                                </div>
                                <button onClick={() => { setShowLoggingModal(false); setActiveAction(null); setCorrectionMode(false); }} className="w-full mt-4 py-2 bg-slate-950 text-slate-400 text-xs rounded-xl font-bold">Cancel Action</button>
                            </div>
                        </div>
                    )}

                    {confirmDialog && (
                        <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-sm relative">
                                <h3 className="text-md font-extrabold text-white mb-2">{confirmDialog.title}</h3>
                                <p className="text-xs text-slate-400 mb-4">{confirmDialog.text}</p>
                                <div className="flex gap-3 text-xs font-bold">
                                    <button onClick={() => setConfirmDialog(null)} className="flex-1 py-2 bg-slate-950 text-slate-400 rounded-xl border border-slate-850">Cancel</button>
                                    <button onClick={confirmDialog.onConfirm} className="flex-1 py-2 bg-red-600 text-white rounded-xl">Confirm</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {foulAlert && (
                        <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className={`border p-6 rounded-2xl w-full max-w-sm shadow-2xl relative my-auto text-center transform scale-100 transition-transform ${
                                foulAlert.type === 'fouled_out' ? 'bg-red-950/95 border-red-500' : 'bg-amber-950/95 border-amber-500'
                            }`}>
                                <div className="flex justify-center mb-3 text-4xl">
                                    {foulAlert.type === 'fouled_out' ? '🚨' : '⚠️'}
                                </div>
                                <h3 className="text-base font-extrabold text-white mb-1 uppercase tracking-wider">
                                    {foulAlert.type === 'fouled_out' ? 'Athlete Fouled Out' : 'Foul Trouble Warning'}
                                </h3>
                                <p className="text-slate-300 text-xs font-semibold mb-4 leading-relaxed">
                                    #{foulAlert.playerNumber} {foulAlert.playerName} has committed personal foul #{foulAlert.count}!
                                </p>
                                {foulAlert.type === 'fouled_out' ? (
                                    <p className="text-red-400 text-[11px] font-bold mb-6">This athlete has reached 5 fouls and is disqualified from the match.</p>
                                ) : (
                                    <p className="text-amber-400 text-[11px] font-bold mb-6">Careful! One more personal foul will result in disqualification.</p>
                                )}
                                <button 
                                    onClick={() => setFoulAlert(null)}
                                    className={`w-full py-2 rounded-xl text-xs font-bold text-white transition-all shadow-md cursor-pointer ${
                                        foulAlert.type === 'fouled_out' ? 'bg-red-600 hover:bg-red-500 shadow-red-500/15' : 'bg-amber-600 hover:bg-amber-500 shadow-amber-500/15'
                                    }`}
                                >
                                    Acknowledge
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
